<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Support - Online Quick Tools</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#e11d48;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

.container{
  width:100%;
  max-width:700px;
  margin:20px auto;
  padding:0 12px;
}

.chat-box{
  background:white;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  overflow:hidden;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid #eee;
  font-weight:bold;
}

.messages{
  height:430px;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  max-width:80%;
  padding:10px 13px;
  border-radius:14px;
  line-height:1.4;
  word-wrap:break-word;
}

.user{
  align-self:flex-end;
  background:#e11d48;
  color:white;
  border-bottom-right-radius:4px;
}

.admin{
  align-self:flex-start;
  background:#eef1f5;
  color:#222;
  border-bottom-left-radius:4px;
}

.time{
  display:block;
  font-size:10px;
  opacity:.7;
  margin-top:4px;
}

.send-area{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.send-area textarea{
  flex:1;
  resize:none;
  min-height:45px;
  max-height:120px;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  font-family:inherit;
}

.send-area button{
  border:0;
  background:#e11d48;
  color:white;
  padding:0 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.send-area button:disabled{
  opacity:.6;
}

.status{
  text-align:center;
  padding:20px;
  color:#666;
}

.home{
  display:block;
  text-align:center;
  margin:18px;
  color:#e11d48;
  text-decoration:none;
  font-weight:bold;
}

body.dark{
  background:#111827;
  color:#eee;
}

body.dark .chat-box{
  background:#1f2937;
}

body.dark .chat-header,
body.dark .send-area{
  border-color:#374151;
}

body.dark .admin{
  background:#374151;
  color:white;
}

body.dark .send-area textarea{
  background:#111827;
  color:white;
  border-color:#4b5563;
}

@media(max-width:500px){
  .messages{
    height:calc(100vh - 230px);
    min-height:350px;
  }

  .message{
    max-width:88%;
  }
}
</style>
</head>

<body>

<header>
  <h1>💬 Chat Support</h1>
</header>

<div class="container">

  <div class="chat-box">

    <div class="chat-header">
      🛠️ Online Quick Tools Support
    </div>

    <div id="messages" class="messages">
      <div class="status">
        Loading chat...
      </div>
    </div>

    <div class="send-area">
      <textarea
        id="messageInput"
        placeholder="Write your message..."
      ></textarea>

      <button id="sendBtn">
        Send
      </button>
    </div>

  </div>

  <a href="index.html" class="home">
    ← Back to Home
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://etkqkptoxkfhxcysaadi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0a3FrcHRveGtmaHhjeXNhYWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTAzMjIsImV4cCI6MjEwMzY2NjMyMn0.HXBJkxIvbELW4XmJB4bsve5u_XpD21B8XNX5ODIsufA";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const messagesBox = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let currentUser = null;

async function init(){

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if(!session){
    messagesBox.innerHTML = `
      <div class="status">
        🔐 Please login to use Chat Support.
      </div>
    `;

    sendBtn.disabled = true;
    messageInput.disabled = true;
    return;
  }

  currentUser = session.user;

  await loadMessages();

  subscribeToMessages();
}

async function loadMessages(){

  const { data, error } = await supabaseClient
    .from("support_messages")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending:true });

  if(error){
    messagesBox.innerHTML = `
      <div class="status">
        ❌ Could not load messages.
      </div>
    `;
    console.error(error);
    return;
  }

  messagesBox.innerHTML = "";

  if(!data || data.length === 0){
    messagesBox.innerHTML = `
      <div class="status">
        👋 Hello! How can we help you?
      </div>
    `;
    return;
  }

  data.forEach(addMessage);

  scrollBottom();
}

function addMessage(msg){

  const div = document.createElement("div");

  div.className =
    "message " +
    (msg.sender === "admin" ? "admin" : "user");

  const text = document.createElement("div");
  text.textContent = msg.message;

  const time = document.createElement("span");
  time.className = "time";

  time.textContent =
    new Date(msg.created_at).toLocaleString();

  div.appendChild(text);
  div.appendChild(time);

  messagesBox.appendChild(div);
}

async function sendMessage(){

  const message = messageInput.value.trim();

  if(!message || !currentUser) return;

  sendBtn.disabled = true;

  const { error } = await supabaseClient
    .from("support_messages")
    .insert({
      user_id: currentUser.id,
      message: message,
      sender: "user"
    });

  if(error){
    alert("❌ Message failed to send.");
    console.error(error);
  }else{
    messageInput.value = "";
  }

  sendBtn.disabled = false;
}

function subscribeToMessages(){

  supabaseClient
    .channel("support-chat-" + currentUser.id)

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"support_messages",
        filter:"user_id=eq." + currentUser.id
      },
      payload => {

        const existing =
          document.querySelector(
            '[data-message-id="' + payload.new.id + '"]'
          );

        if(!existing){

          if(messagesBox.querySelector(".status")){
            messagesBox.innerHTML = "";
          }

          addMessage(payload.new);
          scrollBottom();
        }
      }
    )

    .subscribe();
}

function scrollBottom(){
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

sendBtn.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", function(e){

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

});

init();
</script>

</body>
</html>
