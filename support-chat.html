<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Chat Support - Online Quick Tools</title>

<meta name="description"
      content="Community chat support for Online Quick Tools.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f8fafc;
    color:#111827;
    min-height:100vh;
}

header{
    background:#e11d48;
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

header h1{
    margin:0;
    font-size:23px;
}

header p{
    margin:5px 0 0;
    font-size:13px;
}

.container{
    width:100%;
    max-width:750px;
    margin:18px auto;
    padding:0 10px 30px;
}

.home{
    display:inline-block;
    margin-bottom:12px;
    color:#e11d48;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
}

.chat-box{
    background:white;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.10);
    overflow:hidden;
}

.chat-header{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

.live{
    color:#16a34a;
    font-size:12px;
}

.messages{
    height:55vh;
    min-height:350px;
    max-height:600px;
    overflow-y:auto;
    padding:15px;
    background:#f8fafc;
}

.message{
    max-width:85%;
    margin-bottom:12px;
}

.message.me{
    margin-left:auto;
}

.message.other{
    margin-right:auto;
}

.message-card{
    padding:10px 12px;
    border-radius:13px;
    background:white;
    border:1px solid #e5e7eb;
    box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.message.me .message-card{
    background:#ffe4e6;
    border-color:#fecdd3;
}

.username{
    color:#e11d48;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

.message-text{
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.time{
    display:block;
    margin-top:5px;
    font-size:10px;
    color:#6b7280;
}

.status{
    text-align:center;
    padding:35px 15px;
    color:#6b7280;
    font-size:14px;
}

.login-box{
    text-align:center;
    background:white;
    padding:16px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.login-box p{
    margin:0 0 10px;
}

.login-btn{
    display:inline-block;
    background:#e11d48;
    color:white;
    padding:9px 17px;
    border-radius:9px;
    text-decoration:none;
    font-weight:bold;
}

.send-area{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid #e5e7eb;
    background:white;
}

.send-area textarea{
    flex:1;
    resize:none;
    min-height:46px;
    max-height:120px;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    font-family:inherit;
    font-size:14px;
}

.send-area textarea:focus{
    border-color:#e11d48;
}

.send-area button{
    border:0;
    background:#e11d48;
    color:white;
    padding:0 17px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.send-area button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.send-status{
    text-align:center;
    font-size:12px;
    color:#6b7280;
    min-height:17px;
    padding:0 10px 8px;
}

footer{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    padding:15px;
}


/* DARK MODE */

body.dark{
    background:#0f172a;
    color:#f8fafc;
}

body.dark .home{
    color:#fb7185;
}

body.dark .chat-box,
body.dark .login-box{
    background:#1e293b;
}

body.dark .chat-header{
    border-color:#334155;
}

body.dark .messages{
    background:#0f172a;
}

body.dark .message-card{
    background:#1e293b;
    border-color:#334155;
}

body.dark .message.me .message-card{
    background:#4c1d2b;
    border-color:#881337;
}

body.dark .send-area{
    background:#1e293b;
    border-color:#334155;
}

body.dark .send-area textarea{
    background:#0f172a;
    color:white;
    border-color:#475569;
}

body.dark footer{
    color:#94a3b8;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        margin-top:12px;
    }

    .messages{
        height:58vh;
        min-height:320px;
    }

    .message{
        max-width:92%;
    }

    .send-area button{
        padding:0 14px;
    }

}

</style>

</head>

<body>

<header>

    <h1>💬 Chat Support</h1>

    <p>Community discussion & support</p>

</header>


<div class="container">

    <a href="index.html" class="home">
        ← Back to Home
    </a>


    <div
        id="loginBox"
        class="login-box"
        style="display:none;"
    >

        <p>
            🔐 Please login to send a message.
        </p>

        <a
            href="login.html"
            class="login-btn"
        >
            Login
        </a>

    </div>


    <div class="chat-box">

        <div class="chat-header">

            <span>
                🛠️ Online Quick Tools Community
            </span>

            <span class="live">
                ● Live
            </span>

        </div>


        <div
            id="messages"
            class="messages"
        >

            <div class="status">
                Loading chat...
            </div>

        </div>


        <div class="send-area">

            <textarea
                id="messageInput"
                placeholder="Write your message..."
                maxlength="1000"
                rows="1"
                disabled
            ></textarea>

            <button
                id="sendBtn"
                disabled
            >
                Send
            </button>

        </div>


        <div
            id="sendStatus"
            class="send-status"
        ></div>

    </div>

</div>


<footer>

    © 2026 Online Quick Tools — Chat Support

</footer>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
    "https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTS
===================================== */

const messagesBox =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const loginBox =
    document.getElementById("loginBox");

const sendStatus =
    document.getElementById("sendStatus");


/* =====================================
   USER
===================================== */

let currentUser = null;


/* =====================================
   DARK MODE
===================================== */

if(
    localStorage.getItem("darkMode") === "true" ||
    localStorage.getItem("darkMode") === "1"
){

    document.body.classList.add("dark");

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* =====================================
   TIME
===================================== */

function formatTime(value){

    try{

        return new Date(value).toLocaleString(
            undefined,
            {
                dateStyle:"short",
                timeStyle:"short"
            }
        );

    }catch(error){

        return "";

    }

}


/* =====================================
   GET USERNAME
===================================== */

async function getUsername(userId){

    try{

        const { data, error } =
            await supabaseClient.rpc(
                "get_public_usernames",
                {
                    p_user_ids:[userId]
                }
            );

        if(
            !error &&
            Array.isArray(data) &&
            data.length
        ){

            return (
                data[0].username ||
                data[0].name ||
                "User"
            );

        }

    }catch(error){

        console.log(
            "Username error:",
            error
        );

    }

    return "User";

}


/* =====================================
   LOAD MESSAGES
===================================== */

async function loadMessages(){

    messagesBox.innerHTML =
        `
        <div class="status">
            Loading messages...
        </div>
        `;


    const { data, error } =
        await supabaseClient
            .from("community_messages")
            .select(
                "id,user_id,username,message,image_url,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            )
            .limit(100);


    if(error){

        console.error(
            "Load error:",
            error
        );

        messagesBox.innerHTML =
            `
            <div class="status">
                ❌ Could not load chat messages.
                <br><br>
                Please refresh the page.
            </div>
            `;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        messagesBox.innerHTML =
            `
            <div class="status">
                👋 No messages yet.<br>
                Be the first to say hello!
            </div>
            `;

        return;

    }


    renderMessages(data);

}


/* =====================================
   RENDER
===================================== */

function renderMessages(data){

    messagesBox.innerHTML = "";


    data.forEach(
        message => {

            const wrapper =
                document.createElement("div");


            const isMe =
                currentUser &&
                message.user_id === currentUser.id;


            wrapper.className =
                "message " +
                (
                    isMe
                    ? "me"
                    : "other"
                );


            const card =
                document.createElement("div");

            card.className =
                "message-card";


            const username =
                document.createElement("div");

            username.className =
                "username";

            username.textContent =
                message.username ||
                "User";


            const text =
                document.createElement("div");

            text.className =
                "message-text";

            text.textContent =
                message.message ||
                "";


            const time =
                document.createElement("span");

            time.className =
                "time";

            time.textContent =
                formatTime(
                    message.created_at
                );


            card.appendChild(username);

            card.appendChild(text);


            if(message.image_url){

                const image =
                    document.createElement("img");

                image.src =
                    message.image_url;

                image.alt =
                    "Shared image";

                image.style.maxWidth =
                    "100%";

                image.style.maxHeight =
                    "250px";

                image.style.marginTop =
                    "8px";

                image.style.borderRadius =
                    "10px";

                card.appendChild(image);

            }


            card.appendChild(time);

            wrapper.appendChild(card);

            messagesBox.appendChild(wrapper);

        }
    );


    scrollBottom();

}


/* =====================================
   AUTH CHECK
===================================== */

async function checkAuth(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if(
        !error &&
        data &&
        data.user
    ){

        currentUser =
            data.user;


        loginBox.style.display =
            "none";


        messageInput.disabled =
            false;


        sendBtn.disabled =
            false;


        messageInput.placeholder =
            "Write your message...";


        return true;

    }


    currentUser = null;


    loginBox.style.display =
        "block";


    messageInput.disabled =
        true;


    sendBtn.disabled =
        true;


    messageInput.placeholder =
        "Login to send a message";


    return false;

}


/* =====================================
   SEND MESSAGE
===================================== */

async function sendMessage(){

    if(!currentUser){

        loginBox.style.display =
            "block";

        return;

    }


    const message =
        messageInput.value.trim();


    if(!message){

        sendStatus.textContent =
            "Please write a message.";

        return;

    }


    sendBtn.disabled =
        true;

    messageInput.disabled =
        true;

    sendStatus.textContent =
        "Sending...";


    try{

        let username =
            currentUser.user_metadata?.username ||
            currentUser.user_metadata?.name ||
            "";


        if(!username){

            username =
                await getUsername(
                    currentUser.id
                );

        }


        const { error } =
            await supabaseClient
                .from("community_messages")
                .insert({

                    user_id:
                        currentUser.id,

                    username:
                        username || "User",

                    message:
                        message,

                    image_url:
                        null

                });


        if(error){

            console.error(
                "Send error:",
                error
            );

            sendStatus.textContent =
                "❌ Message failed to send.";

            return;

        }


        messageInput.value = "";

        sendStatus.textContent =
            "✓ Message sent";


        await loadMessages();


        setTimeout(
            function(){

                sendStatus.textContent =
                    "";

            },
            2000
        );


    }catch(error){

        console.error(
            error
        );

        sendStatus.textContent =
            "❌ Something went wrong.";

    }


    messageInput.disabled =
        false;

    sendBtn.disabled =
        false;

    messageInput.focus();

}


/* =====================================
   ENTER TO SEND
===================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================
   BUTTON
===================================== */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =====================================
   SCROLL
===================================== */

function scrollBottom(){

    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


/* =====================================
   REALTIME
===================================== */

function setupRealtime(){

    supabaseClient
        .channel(
            "community-messages-live"
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"community_messages"
            },
            function(payload){

                console.log(
                    "Realtime message:",
                    payload.new
                );


                loadMessages();

            }
        )
        .subscribe(
            function(status){

                console.log(
                    "Realtime status:",
                    status
                );

            }
        );

}


/* =====================================
   AUTH STATE
===================================== */

supabaseClient.auth.onAuthStateChange(
    async function(){

        await checkAuth();

        await loadMessages();

    }
);


/* =====================================
   START
===================================== */

(async function(){

    await checkAuth();

    await loadMessages();

    setupRealtime();

})();

</script>

</body>
</html>
