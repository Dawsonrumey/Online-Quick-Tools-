<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Support - Online Quick Tools</title>

<meta name="description"
      content="Private Chat Support for Online Quick Tools">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

body.dark{
    background:#111827;
    color:#f9fafb;
}

.header{
    background:#e11d48;
    color:white;
    padding:16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:700px;
    margin:20px auto;
    padding:0 12px;
}

.card{
    background:white;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
    overflow:hidden;
}

body.dark .card{
    background:#1f2937;
}

.status{
    padding:12px 15px;
    border-bottom:1px solid #e5e7eb;
    font-size:14px;
}

body.dark .status{
    border-color:#374151;
}

.live{
    color:#16a34a;
    font-weight:bold;
}

#chatBox{
    height:60vh;
    min-height:350px;
    overflow-y:auto;
    padding:15px;
}

.message{
    display:flex;
    margin:10px 0;
}

.message.user{
    justify-content:flex-end;
}

.message.admin{
    justify-content:flex-start;
}

.bubble{
    max-width:78%;
    padding:10px 13px;
    border-radius:15px;
    line-height:1.45;
    word-wrap:break-word;
}

.user .bubble{
    background:#e11d48;
    color:white;
    border-bottom-right-radius:4px;
}

.admin .bubble{
    background:#e5e7eb;
    color:#111827;
    border-bottom-left-radius:4px;
}

body.dark .admin .bubble{
    background:#374151;
    color:#f9fafb;
}

.sender{
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
    opacity:.75;
}

.time{
    font-size:10px;
    margin-top:5px;
    opacity:.7;
    text-align:right;
}

.image-preview{
    max-width:100%;
    max-height:220px;
    border-radius:10px;
    margin-top:7px;
}

.composer{
    border-top:1px solid #e5e7eb;
    padding:12px;
    display:flex;
    gap:8px;
}

body.dark .composer{
    border-color:#374151;
}

#messageInput{
    flex:1;
    resize:none;
    min-height:45px;
    max-height:120px;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    background:white;
    color:#111827;
}

body.dark #messageInput{
    background:#111827;
    color:white;
    border-color:#4b5563;
}

#sendBtn{
    border:0;
    background:#e11d48;
    color:white;
    padding:0 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

#sendBtn:disabled{
    opacity:.6;
}

.bottom{
    text-align:center;
    padding:15px;
}

.home-btn{
    display:inline-block;
    text-decoration:none;
    color:#e11d48;
    font-weight:bold;
}

.notice{
    text-align:center;
    padding:30px 15px;
    color:#6b7280;
}

.login-btn{
    display:inline-block;
    margin-top:10px;
    padding:10px 18px;
    background:#e11d48;
    color:white;
    text-decoration:none;
    border-radius:9px;
}
</style>
</head>

<body>

<div class="header">
    <h1>💬 Online Quick Tools Support</h1>
    <p>Private support conversation</p>
</div>

<div class="container">

    <div class="card">

        <div class="status">
            <span class="live">● Live</span>
            <span id="statusText"> Connecting...</span>
        </div>

        <div id="chatBox">
            <div class="notice">
                Loading your conversation...
            </div>
        </div>

        <div class="composer">
            <textarea
                id="messageInput"
                placeholder="Type your message..."
                maxlength="2000"></textarea>

            <button id="sendBtn">
                Send
            </button>
        </div>

    </div>

    <div class="bottom">
        <a class="home-btn" href="index.html">← Back to Home</a>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const chatBox =
    document.getElementById("chatBox");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const statusText =
    document.getElementById("statusText");

let currentUser = null;
let realtimeChannel = null;
let loadedMessageIds = new Set();


function escapeHtml(text){

    if(!text) return "";

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(date){

    return new Date(date).toLocaleString(
        undefined,
        {
            month:"numeric",
            day:"numeric",
            year:"2-digit",
            hour:"numeric",
            minute:"2-digit"
        }
    );
}


async function getUsername(userId){

    try{

        const {data,error} =
            await supabaseClient.rpc(
                "get_public_usernames",
                {
                    p_user_ids:[userId]
                }
            );

        if(error || !data || !data.length){
            return "User";
        }

        const row = data[0];

        return row.username ||
               row.display_name ||
               "User";

    }catch(error){

        return "User";
    }
}


async function renderMessage(message){

    if(!message || loadedMessageIds.has(message.id)){
        return;
    }

    loadedMessageIds.add(message.id);

    const isAdmin =
        message.sender_type === "admin";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (isAdmin ? "admin" : "user");

    let senderName =
        isAdmin
        ? "Admin"
        : await getUsername(message.user_id);

    let imageHTML = "";

    if(message.image_url){

        imageHTML =
        `<img
            class="image-preview"
            src="${escapeHtml(message.image_url)}"
            alt="Attachment"
            loading="lazy">`;
    }

    wrapper.innerHTML = `
        <div class="bubble">

            <div class="sender">
                ${escapeHtml(senderName)}
            </div>

            <div>
                ${escapeHtml(message.message)}
            </div>

            ${imageHTML}

            <div class="time">
                ${formatTime(message.created_at)}
            </div>

        </div>
    `;

    chatBox.appendChild(wrapper);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


async function loadMessages(){

    if(!currentUser){
        return;
    }

    chatBox.innerHTML = `
        <div class="notice">
            Loading your conversation...
        </div>
    `;

    loadedMessageIds.clear();

    const {data,error} =
        await supabaseClient
        .from("community_messages")
        .select(`
            id,
            user_id,
            username,
            message,
            image_url,
            created_at,
            sender_type,
            reply_to_user_id
        `)
        .or(
            `user_id.eq.${currentUser.id},reply_to_user_id.eq.${currentUser.id}`
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );

    if(error){

        console.error(error);

        chatBox.innerHTML = `
            <div class="notice">
                ❌ Could not load messages.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    chatBox.innerHTML = "";

    if(!data || data.length === 0){

        chatBox.innerHTML = `
            <div class="notice">
                No messages yet.<br>
                Send a message to contact support.
            </div>
        `;

        return;
    }

    for(const message of data){

        await renderMessage(message);
    }

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


async function sendMessage(){

    const message =
        messageInput.value.trim();

    if(!message){
        return;
    }

    if(!currentUser){

        alert("Please login first.");
        return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    const {error} =
        await supabaseClient
        .from("community_messages")
        .insert({

            user_id:
                currentUser.id,

            username:
                await getUsername(currentUser.id),

            message:
                message,

            image_url:
                null,

            sender_type:
                "user",

            reply_to_user_id:
                null
        });

    if(error){

        console.error(error);

        alert(
            "Message failed: " +
            error.message
        );

    }else{

        messageInput.value = "";
    }

    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
}


function setupRealtime(){

    if(!currentUser){
        return;
    }

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );
    }

    realtimeChannel =
        supabaseClient
        .channel(
            "private-support-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"community_messages"
            },
            async payload => {

                const message =
                    payload.new;

                if(
                    message.user_id === currentUser.id ||
                    message.reply_to_user_id === currentUser.id
                ){

                    await renderMessage(message);

                    chatBox.scrollTop =
                        chatBox.scrollHeight;
                }
            }
        )
        .subscribe(
            status => {

                if(status === "SUBSCRIBED"){

                    statusText.textContent =
                        " Connected";
                }
            }
        );
}


async function init(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        showLoginMessage();

        return;
    }

    currentUser =
        data.session?.user || null;

    if(!currentUser){

        showLoginMessage();

        return;
    }

    statusText.textContent =
        " Connected";

    await loadMessages();

    setupRealtime();
}


function showLoginMessage(){

    chatBox.innerHTML = `
        <div class="notice">

            🔐 Please login to use Chat Support.

            <br>

            <a
                class="login-btn"
                href="account.html">
                Login
            </a>

        </div>
    `;

    messageInput.disabled = true;
    sendBtn.disabled = true;

    statusText.textContent =
        " Login required";
}


sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if(session?.user){

            currentUser =
                session.user;

            messageInput.disabled =
                false;

            sendBtn.disabled =
                false;

            statusText.textContent =
                " Connected";

            await loadMessages();

            setupRealtime();

        }else{

            currentUser = null;

            if(realtimeChannel){

                supabaseClient
                .removeChannel(
                    realtimeChannel
                );

                realtimeChannel = null;
            }

            showLoginMessage();
        }
    }
);


init();

</script>

</body>
</html>
