<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Online Quick Tools</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:1000px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
    text-align:center;
}

h2{
    margin-top:0;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login-btn{
    width:100%;
    background:#4f46e5;
    color:white;
    font-size:16px;
}

.logout{
    background:#333;
    color:white;
}

.refresh{
    background:#2563eb;
    color:white;
}

.approve{
    background:#16a34a;
    color:white;
}

.reject{
    background:#f59e0b;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

.hidden{
    display:none;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
}

.success{
    color:#15803d;
}

.error{
    color:#dc2626;
}

.info{
    color:#2563eb;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.topbar h1{
    margin:0;
    text-align:left;
}

.user-info{
    padding:12px;
    background:#f1f5ff;
    border-radius:9px;
    margin-top:15px;
    font-size:14px;
    word-break:break-word;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.stat-number{
    font-size:25px;
    font-weight:bold;
}

.stat-label{
    color:#666;
    font-size:13px;
    margin-top:5px;
}

.video-card{
    background:#fafafa;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin:15px 0;
}

.video-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.meta{
    color:#555;
    font-size:14px;
    margin:7px 0;
    word-break:break-word;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#fff3cd;
    color:#856404;
    font-size:12px;
    font-weight:bold;
}

.video-preview{
    width:100%;
    max-height:420px;
    background:#000;
    border-radius:10px;
    margin:12px 0;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.actions button{
    flex:1;
    min-width:100px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.debug{
    background:#111827;
    color:#d1d5db;
    padding:15px;
    border-radius:10px;
    font-family:monospace;
    font-size:12px;
    white-space:pre-wrap;
    word-break:break-word;
    margin-top:15px;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .topbar{
        align-items:stretch;
    }

    .topbar button{
        width:100%;
        margin-top:5px;
    }

}
</style>
</head>

<body>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginBox" class="card">

<h1>🔐 Admin Login</h1>

<p>
Login with your Supabase admin account.
</p>

<input
    id="email"
    type="email"
    placeholder="Admin email"
    autocomplete="username"
>

<input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
>

<button
    id="loginBtn"
    class="login-btn"
>
Login
</button>

<div
    id="loginMessage"
    class="message"
></div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div
    id="adminPanel"
    class="hidden"
>

<div class="card">

<div class="topbar">

<h1>🎬 Video Admin Panel</h1>

<div>

<button
    id="refreshBtn"
    class="refresh"
>
🔄 Refresh
</button>

<button
    id="logoutBtn"
    class="logout"
>
Logout
</button>

</div>

</div>


<div
    id="userInfo"
    class="user-info"
></div>


<div
    id="mainMessage"
    class="message"
></div>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">

<div
    id="totalCount"
    class="stat-number"
>
0
</div>

<div class="stat-label">
Total Videos
</div>

</div>


<div class="stat">

<div
    id="pendingCount"
    class="stat-number"
>
0
</div>

<div class="stat-label">
Pending
</div>

</div>


<div class="stat">

<div
    id="approvedCount"
    class="stat-number"
>
0
</div>

<div class="stat-label">
Approved
</div>

</div>

</div>

</div>


<!-- ================= PENDING ================= -->

<div class="card">

<h2>⏳ Pending Videos</h2>

<div id="pendingVideos">

<div class="empty">
Loading...
</div>

</div>

</div>


<!-- ================= DATABASE TEST ================= -->

<div class="card">

<h2>🔧 Database Test</h2>

<p>
This section shows exactly what the Admin Panel can read from the Videos table.
</p>

<div
    id="debugBox"
    class="debug"
>
Waiting for database test...
</div>

</div>

</div>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==================================================
   ELEMENTS
================================================== */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const refreshBtn =
document.getElementById("refreshBtn");

const loginMessage =
document.getElementById("loginMessage");

const mainMessage =
document.getElementById("mainMessage");

const userInfo =
document.getElementById("userInfo");

const pendingVideos =
document.getElementById("pendingVideos");

const totalCount =
document.getElementById("totalCount");

const pendingCount =
document.getElementById("pendingCount");

const approvedCount =
document.getElementById("approvedCount");

const debugBox =
document.getElementById("debugBox");


/* ==================================================
   LOGIN
================================================== */

loginBtn.addEventListener(
    "click",
    loginAdmin
);


passwordInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            loginAdmin();
        }

    }
);


async function loginAdmin(){

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    if(!email || !password){

        loginMessage.className =
        "message error";

        loginMessage.textContent =
        "❌ Enter email and password.";

        return;
    }


    loginBtn.disabled = true;

    loginMessage.className =
    "message info";

    loginMessage.textContent =
    "⏳ Logging in...";


    try{

        const result =
        await client.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(result.error){

            loginMessage.className =
            "message error";

            loginMessage.textContent =
            "❌ Login failed: " +
            result.error.message;

            loginBtn.disabled = false;

            return;
        }


        loginMessage.className =
        "message success";

        loginMessage.textContent =
        "✅ Login successful.";


        loginBtn.disabled = false;


        await showAdmin();

    }

    catch(error){

        loginMessage.className =
        "message error";

        loginMessage.textContent =
        "❌ Login error: " +
        error.message;

        loginBtn.disabled = false;

    }

}


/* ==================================================
   SHOW ADMIN
================================================== */

async function showAdmin(){

    loginBox.classList.add(
        "hidden"
    );

    adminPanel.classList.remove(
        "hidden"
    );


    const sessionResult =
    await client.auth.getSession();


    if(
        sessionResult.data &&
        sessionResult.data.session
    ){

        const user =
        sessionResult.data.session.user;


        userInfo.innerHTML =
        "<b>Logged in as:</b><br>" +
        escapeHTML(
            user.email ||
            "Unknown"
        ) +
        "<br><br>" +
        "<b>User ID:</b><br>" +
        escapeHTML(
            user.id
        );

    }


    await loadVideos();

}


/* ==================================================
   LOAD VIDEOS
================================================== */

async function loadVideos(){

    pendingVideos.innerHTML =
    '<div class="empty">' +
    '⏳ Loading videos...' +
    '</div>';


    debugBox.textContent =
    "Running database query...";


    mainMessage.textContent =
    "";


    const result =
    await client
    .from("Videos")
    .select(
        "id,title,platform,videos_url,status,created_at"
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    const data =
    result.data;

    const error =
    result.error;


    /* DATABASE ERROR */

    if(error){

        pendingVideos.innerHTML =
        '<div class="empty">' +
        '❌ Database query failed.' +
        '</div>';


        debugBox.textContent =
        "DATABASE ERROR\n\n" +
        "Code: " +
        (error.code || "N/A") +
        "\n\n" +
        "Message: " +
        (error.message || "N/A") +
        "\n\n" +
        "Details: " +
        (error.details || "N/A") +
        "\n\n" +
        "Hint: " +
        (error.hint || "N/A");


        totalCount.textContent =
        "ERROR";

        pendingCount.textContent =
        "ERROR";

        approvedCount.textContent =
        "ERROR";


        mainMessage.className =
        "message error";

        mainMessage.textContent =
        "❌ Videos table could not be read.";

        return;
    }


    /* SUCCESS */

    const videos =
    Array.isArray(data)
    ? data
    : [];


    debugBox.textContent =
    "DATABASE QUERY SUCCESS\n\n" +
    "Rows received: " +
    videos.length +
    "\n\n" +
    JSON.stringify(
        videos,
        null,
        2
    );


    /* STATS */

    const pending =
    videos.filter(
        function(video){

            return String(
                video.status || ""
            )
            .trim()
            .toLowerCase()
            === "pending";

        }
    );


    const approved =
    videos.filter(
        function(video){

            return String(
                video.status || ""
            )
            .trim()
            .toLowerCase()
            === "approved";

        }
    );


    totalCount.textContent =
    videos.length;

    pendingCount.textContent =
    pending.length;

    approvedCount.textContent =
    approved.length;


    /* PENDING EMPTY */

    if(
        pending.length === 0
    ){

        pendingVideos.innerHTML =
        '<div class="empty">' +
        '🎉 No pending videos.' +
        '<br><br>' +
        'Total rows found: ' +
        videos.length +
        '</div>';

        return;
    }


    /* SHOW PENDING */

    pendingVideos.innerHTML =
    "";


    pending.forEach(
        function(video){

            pendingVideos.appendChild(
                createVideoCard(video)
            );

        }
    );

}


/* ==================================================
   CREATE VIDEO CARD
================================================== */

function createVideoCard(video){

    const card =
    document.createElement("div");

    card.className =
    "video-card";


    const title =
    escapeHTML(
        video.title ||
        "Untitled"
    );


    const platform =
    escapeHTML(
        video.platform ||
        "Direct"
    );


    const url =
    escapeHTML(
        video.videos_url ||
        ""
    );


    const created =
    escapeHTML(
        video.created_at ||
        ""
    );


    card.innerHTML = `

        <div class="video-title">
            ${title}
        </div>

        <div class="meta">
            <b>ID:</b>
            ${escapeHTML(video.id)}
        </div>

        <div class="meta">
            <b>Platform:</b>
            ${platform}
        </div>

        <div class="meta">
            <span class="status">
                PENDING
            </span>
        </div>

        <div class="meta">
            <b>Created:</b>
            ${created}
        </div>

        <div class="meta">
            <b>Video URL:</b><br>
            ${url}
        </div>

        <div class="preview-container"></div>

        <div class="actions">

            <button class="approve">
                ✅ Approve
            </button>

            <button class="reject">
                ❌ Reject
            </button>

            <button class="delete">
                🗑️ Delete
            </button>

        </div>

    `;


    const previewContainer =
    card.querySelector(
        ".preview-container"
    );


    /* DIRECT VIDEO */

    if(
        video.platform === "Direct" &&
        video.videos_url
    ){

        const videoElement =
        document.createElement("video");


        videoElement.className =
        "video-preview";


        videoElement.controls =
        true;


        videoElement.preload =
        "metadata";


        videoElement.src =
        video.videos_url;


        previewContainer.appendChild(
            videoElement
        );

    }


    /* EXTERNAL VIDEO */

    else if(
        video.videos_url
    ){

        const link =
        document.createElement("a");


        link.href =
        video.videos_url;


        link.target =
        "_blank";


        link.rel =
        "noopener noreferrer";


        if(
            video.platform ===
            "YouTube"
        ){

            link.textContent =
            "▶️ Open YouTube Video";

        }

        else if(
            video.platform ===
            "Facebook"
        ){

            link.textContent =
            "📘 Open Facebook Video";

        }

        else if(
            video.platform ===
            "TikTok"
        ){

            link.textContent =
            "🎵 Open TikTok Video";

        }

        else{

            link.textContent =
            "🔗 Open Video";

        }


        previewContainer.appendChild(
            link
        );

    }


    /* APPROVE */

    card.querySelector(
        ".approve"
    )
    .addEventListener(
        "click",
        function(){

            updateStatus(
                video.id,
                "approved"
            );

        }
    );


    /* REJECT */

    card.querySelector(
        ".reject"
    )
    .addEventListener(
        "click",
        function(){

            updateStatus(
                video.id,
                "rejected"
            );

        }
    );


    /* DELETE */

    card.querySelector(
        ".delete"
    )
    .addEventListener(
        "click",
        function(){

            deleteVideo(video);

        }
    );


    return card;

}


/* ==================================================
   UPDATE STATUS
================================================== */

async function updateStatus(
    id,
    newStatus
){

    mainMessage.className =
    "message info";

    mainMessage.textContent =
    "⏳ Updating video...";


    const result =
    await client
    .from("Videos")
    .update({
        status:newStatus
    })
    .eq(
        "id",
        id
    );


    if(result.error){

        mainMessage.className =
        "message error";

        mainMessage.textContent =
        "❌ Update failed: " +
        result.error.message;

        return;
    }


    mainMessage.className =
    "message success";


    mainMessage.textContent =
    newStatus === "approved"
    ?
    "✅ Video approved."
    :
    "❌ Video rejected.";


    await loadVideos();

}


/* ==================================================
   DELETE VIDEO
================================================== */

async function deleteVideo(video){

    const confirmDelete =
    confirm(
        "Delete this video permanently?"
    );


    if(!confirmDelete){
        return;
    }


    mainMessage.className =
    "message info";

    mainMessage.textContent =
    "⏳ Deleting video...";


    /* DATABASE DELETE */

    const result =
    await client
    .from("Videos")
    .delete()
    .eq(
        "id",
        video.id
    );


    if(result.error){

        mainMessage.className =
        "message error";

        mainMessage.textContent =
        "❌ Delete failed: " +
        result.error.message;

        return;
    }


    /* STORAGE DELETE */

    if(
        video.platform === "Direct" &&
        video.videos_url
    ){

        const marker =
        "/storage/v1/object/public/videos/";


        const position =
        video.videos_url.indexOf(
            marker
        );


        if(position !== -1){

            const filePath =
            video.videos_url.substring(
                position +
                marker.length
            );


            const storageResult =
            await client
            .storage
            .from("videos")
            .remove([
                filePath
            ]);


            if(
                storageResult.error
            ){

                console.warn(
                    "Storage delete error:",
                    storageResult.error
                );

            }

        }

    }


    mainMessage.className =
    "message success";

    mainMessage.textContent =
    "🗑️ Video deleted.";


    await loadVideos();

}


/* ==================================================
   LOGOUT
================================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        await client.auth.signOut();


        adminPanel.classList.add(
            "hidden"
        );


        loginBox.classList.remove(
            "hidden"
        );


        passwordInput.value =
        "";


        loginMessage.textContent =
        "";


        mainMessage.textContent =
        "";


        debugBox.textContent =
        "Logged out.";

    }
);


/* ==================================================
   REFRESH
================================================== */

refreshBtn.addEventListener(
    "click",
    async function(){

        await loadVideos();

    }
);


/* ==================================================
   SESSION CHECK
================================================== */

async function checkSession(){

    const result =
    await client.auth.getSession();


    if(
        result.data &&
        result.data.session
    ){

        await showAdmin();

    }

}


checkSession();


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(value){

    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
