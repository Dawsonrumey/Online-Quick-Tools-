<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rewards History - Online Quick Tools</title>

<meta name="description"
content="View your daily rewards, task rewards and referral history on Online Quick Tools.">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
    transition:.3s;
}

body.dark{
    background:#111827;
    color:#f3f4f6;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    margin:0 0 12px;
    font-size:24px;
}

.nav{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.nav a,
.nav button{
    border:0;
    text-decoration:none;
    background:white;
    color:#4f46e5;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.dark .card{
    background:#1f2937;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.login-box{
    text-align:center;
    padding:28px;
}

.login-box a{
    display:inline-block;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    padding:11px 20px;
    border-radius:8px;
    margin-top:10px;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    text-align:center;
    padding:16px 10px;
    border-radius:12px;
    background:#eef2ff;
}

.dark .stat{
    background:#374151;
}

.stat strong{
    display:block;
    font-size:27px;
    color:#4f46e5;
    margin-bottom:5px;
}

.dark .stat strong{
    color:#a5b4fc;
}

.stat span{
    font-size:13px;
}

.section-title{
    margin-top:0;
    font-size:20px;
}

.transaction{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #e5e7eb;
}

.dark .transaction{
    border-bottom-color:#374151;
}

.transaction:last-child{
    border-bottom:0;
}

.icon{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#eef2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    flex-shrink:0;
}

.dark .icon{
    background:#374151;
}

.transaction-info{
    flex:1;
}

.transaction-info strong{
    display:block;
    margin-bottom:5px;
}

.transaction-info small{
    color:#6b7280;
}

.dark .transaction-info small{
    color:#cbd5e1;
}

.amount{
    font-size:18px;
    font-weight:bold;
    color:#16a34a;
}

.referral{
    padding:15px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    margin-bottom:10px;
}

.dark .referral{
    border-color:#374151;
}

.referral strong{
    display:block;
    margin-bottom:7px;
}

.referral small{
    display:block;
    margin-top:7px;
    color:#6b7280;
}

.dark .referral small{
    color:#cbd5e1;
}

.empty{
    text-align:center;
    padding:25px 10px;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    word-break:break-word;
}

.dark .error{
    background:#451a1a;
    color:#fecaca;
}

.loading{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

footer{
    text-align:center;
    padding:25px 15px;
    color:#6b7280;
    font-size:13px;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .transaction{
        align-items:flex-start;
    }

    .amount{
        font-size:16px;
    }

}

</style>

</head>

<body>

<header>

    <h1>🎁 Rewards History</h1>

    <div class="nav">

        <a href="profile.html">👤 Profile</a>

        <a href="index.html">🏠 Home</a>

        <button onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>

    </div>

</header>


<div class="container">

    <!-- LOGIN -->

    <div id="loginBox"
         class="card login-box"
         style="display:none;">

        <h2>🔐 Login Required</h2>

        <p>
            Please login to view your rewards history.
        </p>

        <a href="login.html">
            Login
        </a>

    </div>


    <!-- MAIN -->

    <div id="mainContent"
         style="display:none;">


        <!-- STATS -->

        <div class="card">

            <div class="stats">

                <div class="stat">

                    <strong id="totalReferrals">
                        0
                    </strong>

                    <span>
                        Total Referrals
                    </span>

                </div>


                <div class="stat">

                    <strong id="referralPoints">
                        0
                    </strong>

                    <span>
                        Referral Points
                    </span>

                </div>


                <div class="stat">

                    <strong id="currentPoints">
                        0
                    </strong>

                    <span>
                        Current Points
                    </span>

                </div>

            </div>

        </div>


        <!-- REWARD HISTORY -->

        <div class="card">

            <h2 class="section-title">
                💰 Points & Reward History
            </h2>

            <div id="transactions">

                <div class="loading">
                    Loading rewards...
                </div>

            </div>

        </div>


        <!-- REFERRAL HISTORY -->

        <div class="card">

            <h2 class="section-title">
                👥 Referral History
            </h2>

            <div id="history">

                <div class="loading">
                    Loading referrals...
                </div>

            </div>

        </div>

    </div>

</div>


<footer>
    © 2026 Online Quick Tools
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const loginBox =
document.getElementById("loginBox");

const mainContent =
document.getElementById("mainContent");

const transactions =
document.getElementById("transactions");

const history =
document.getElementById("history");


/* =========================
   DARK MODE
========================= */

function toggleDarkMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
            ? "on"
            : "off"
    );
}


if(
    localStorage.getItem("darkMode") === "on"
){

    document.body.classList.add("dark");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   DATE FORMAT
========================= */

function formatDate(date){

    if(!date){
        return "Unknown date";
    }

    const d =
        new Date(date);

    if(
        isNaN(d.getTime())
    ){

        return String(date);

    }

    return d.toLocaleString(
        "en-BD",
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


/* =========================
   REWARD ICON
========================= */

function getRewardIcon(type){

    type =
        String(type || "")
        .toLowerCase();

    if(
        type.includes("daily") ||
        type.includes("login")
    ){

        return "🎁";

    }

    if(
        type.includes("task")
    ){

        return "✅";

    }

    if(
        type.includes("referral") ||
        type.includes("refer")
    ){

        return "👥";

    }

    return "⭐";

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(userId){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select(
            "points, referral_count"
        )
        .eq("id", userId)
        .single();


    if(error){

        throw new Error(
            "Profile error: " +
            error.message
        );

    }


    document.getElementById(
        "currentPoints"
    ).textContent =
        data?.points ?? 0;


    document.getElementById(
        "totalReferrals"
    ).textContent =
        data?.referral_count ?? 0;


    document.getElementById(
        "referralPoints"
    ).textContent =
        (data?.referral_count ?? 0) * 10;

}


/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions(userId){

    transactions.innerHTML =
        `<div class="loading">
            Loading reward transactions...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("reward_transactions")
        .select(
            "id, amount, type, description, created_at"
        )
        .eq("user_id", userId)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        transactions.innerHTML =
            `<div class="error">
                ❌ Could not load reward history.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        transactions.innerHTML =
            `<div class="empty">
                🎁 No reward transactions yet.
            </div>`;

        return;

    }


    transactions.innerHTML = "";


    data.forEach(row => {

        const div =
            document.createElement("div");

        div.className =
            "transaction";


        div.innerHTML = `

            <div class="icon">
                ${getRewardIcon(row.type)}
            </div>

            <div class="transaction-info">

                <strong>
                    ${escapeHtml(
                        row.description ||
                        row.type ||
                        "Reward"
                    )}
                </strong>

                <small>
                    ${formatDate(
                        row.created_at
                    )}
                </small>

            </div>

            <div class="amount">
                +${Number(row.amount || 0)}
            </div>

        `;


        transactions.appendChild(div);

    });

}


/* =========================
   LOAD REFERRALS
========================= */

async function loadReferrals(userId){

    history.innerHTML =
        `<div class="loading">
            Loading referral history...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("referrals")
        .select(`
            id,
            referred_user_id,
            referral_code,
            reward_referrer,
            status,
            created_at
        `)
        .eq("referrer_id", userId)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        history.innerHTML =
            `<div class="error">
                ❌ Could not load referral history.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        history.innerHTML =
            `<div class="empty">
                👥 No referral history yet.
            </div>`;

        return;

    }


    const userIds =
        data
        .map(row =>
            row.referred_user_id
        )
        .filter(Boolean);


    let usernameMap = {};


    /*
       Get public usernames.
       If the RPC is unavailable,
       referral history will still show.
    */

    if(userIds.length > 0){

        try{

            const {
                data:names,
                error:nameError
            } =
                await supabaseClient.rpc(
                    "get_public_usernames",
                    {
                        user_ids:userIds
                    }
                );


            if(
                !nameError &&
                names
            ){

                names.forEach(item => {

                    usernameMap[
                        item.id ||
                        item.user_id
                    ] =
                        item.username ||
                        "User";

                });

            }

        }
        catch(e){

            console.log(
                "Username lookup skipped"
            );

        }

    }


    history.innerHTML = "";


    data.forEach(row => {

        const div =
            document.createElement("div");

        div.className =
            "referral";


        const username =
            usernameMap[
                row.referred_user_id
            ] ||
            "Referred User";


        const reward =
            Number(
                row.reward_referrer || 0
            );


        div.innerHTML = `

            <strong>
                👤 ${escapeHtml(username)}
            </strong>

            <div>
                Status:
                <b>
                    ${escapeHtml(
                        row.status ||
                        "pending"
                    )}
                </b>
            </div>

            <div>
                Reward:
                <b>
                    +${reward || 10} points
                </b>
            </div>

            <small>
                ${formatDate(
                    row.created_at
                )}
            </small>

        `;


        history.appendChild(div);

    });

}


/* =========================
   LOAD PAGE
========================= */

async function loadPage(user){

    if(!user){

        loginBox.style.display =
            "block";

        mainContent.style.display =
            "none";

        return;

    }


    loginBox.style.display =
        "none";

    mainContent.style.display =
        "block";


    try{

        await loadProfile(
            user.id
        );

    }
    catch(error){

        console.error(error);

    }


    await loadTransactions(
        user.id
    );


    await loadReferrals(
        user.id
    );

}


/* =========================
   INITIAL SESSION
========================= */

async function init(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient.auth.getSession();


    await loadPage(
        session?.user || null
    );

}


/* =========================
   AUTH CHANGE
========================= */

supabaseClient.auth.onAuthStateChange(
    async(event,session)=>{

        await loadPage(
            session?.user || null
        );

    }
);


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
