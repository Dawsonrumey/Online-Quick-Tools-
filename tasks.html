<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Earn Points - Online Quick Tools</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#111827;
}

header{
    background:#2563eb;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    max-width:650px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.back{
    display:block;
    text-align:center;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:bold;
}

.task{
    border:1px solid #e5e7eb;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
}

.task h3{
    margin:0 0 8px;
}

.description{
    color:#6b7280;
    font-size:14px;
}

.reward{
    color:#16a34a;
    font-weight:bold;
    margin-top:10px;
}

.complete-btn{
    width:100%;
    border:0;
    background:#16a34a;
    color:white;
    padding:12px;
    border-radius:9px;
    margin-top:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.complete-btn:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.message{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}
</style>
</head>

<body>

<header>
    <h1>💰 Earn Points</h1>
</header>

<div class="container">

<a href="dashboard.html" class="back">
    ← Back to Dashboard
</a>

<div id="success" class="success"></div>

<div id="error" class="error"></div>

<div class="card">

    <h2>Available Tasks</h2>

    <div id="taskList" class="message">
        Loading tasks...
    </div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function loadTasks(){

    const taskList =
        document.getElementById("taskList");

    try{

        const {
            data:{
                user
            },
            error:userError
        } =
        await supabaseClient.auth.getUser();

        if(userError){
            throw userError;
        }

        if(!user){

            window.location.href =
            "login.html";

            return;
        }


        const {
            data:tasks,
            error
        } =
        await supabaseClient
        .from("reward_tasks")
        .select(
            "id,title,description,reward_points,task_type"
        )
        .eq("status","active")
        .order("created_at",{
            ascending:false
        });


        if(error){
            throw error;
        }


        if(!tasks || tasks.length === 0){

            taskList.innerHTML =
            "No tasks available right now.";

            return;
        }


        const {
            data:completedTasks,
            error:completedError
        } =
        await supabaseClient
        .from("completed_tasks")
        .select("task_id")
        .eq("user_id",user.id);


        if(completedError){
            throw completedError;
        }


        const completedIds =
            new Set(
                (completedTasks || [])
                .map(item => item.task_id)
            );


        taskList.innerHTML =
        tasks.map(task => {

            const completed =
                completedIds.has(task.id);


            return `

            <div class="task">

                <h3>
                    ${escapeHtml(task.title)}
                </h3>

                <div class="description">
                    ${escapeHtml(
                        task.description || ""
                    )}
                </div>

                <div class="reward">
                    🎁 +${task.reward_points} Points
                </div>

                <button
                    class="complete-btn"
                    onclick="completeTask(${task.id}, this)"
                    ${completed ? "disabled" : ""}
                >
                    ${
                        completed
                        ? "✅ Completed"
                        : "Complete Task"
                    }
                </button>

            </div>

            `;

        }).join("");


    }catch(error){

        console.error(error);

        taskList.innerHTML =
        "Unable to load tasks.";

    }

}


async function completeTask(
    taskId,
    button
){

    button.disabled = true;

    button.textContent =
        "Completing...";


    hideMessages();


    try{

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "complete_reward_task",
            {
                target_task_id:taskId
            }
        );


        if(error){
            throw error;
        }


        showSuccess(
            "🎉 Task completed! +" +
            data +
            " points added."
        );


        button.textContent =
            "✅ Completed";


    }catch(error){

        console.error(error);


        if(
            error.message &&
            error.message.includes(
                "duplicate key"
            )
        ){

            showError(
                "You have already completed this task."
            );

            button.textContent =
                "✅ Completed";

        }else{

            showError(
                error.message ||
                "Unable to complete task."
            );

            button.disabled = false;

            button.textContent =
                "Complete Task";

        }

    }

}


function showSuccess(message){

    const box =
        document.getElementById("success");

    box.textContent =
        message;

    box.style.display =
        "block";

}


function showError(message){

    const box =
        document.getElementById("error");

    box.textContent =
        message;

    box.style.display =
        "block";

}


function hideMessages(){

    document.getElementById(
        "success"
    ).style.display = "none";

    document.getElementById(
        "error"
    ).style.display = "none";

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


loadTasks();

</script>

</body>
</html>
