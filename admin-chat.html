<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Chat - Online Quick Tools</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#e11d48;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

.container{
  max-width:1000px;
  margin:20px auto;
  padding:0 12px;
}

.panel{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.top{
  padding:15px;
  border-bottom:1px solid #eee;
  font-weight:bold;
}

.users{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:600px;
}

.user-list{
  border-right:1px solid #eee;
  overflow-y:auto;
}

.user-item{
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.user-item:hover,
.user-item.active{
  background:#fff1f2;
}

.user-id{
  font-size:12px;
  color:#777;
  word-break:break-all;
}

.chat{
  display:flex;
  flex-direction:column;
}

.chat-header{
  padding:14px;
  border-bottom:1px solid #eee;
  font-weight:bold;
}

.messages{
  flex:1;
  min-height:470px;
  max-height:470px;
  overflow-y:auto;
  padding:15px;

  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:14px;
  line-height:1.4;
}

.message.user{
  align-self:flex-start;
  background:#eef1f5;
}

.message.admin{
  align-self:flex-end;
  background:#e11d48;
  color:white;
}

.time{
  display:block;
  font-size:10px;
  opacity:.7;
  margin-top:4px;
}

.reply{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}

.reply textarea{
  flex:1;
  resize:none;
  min-height:45px;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:inherit;
}

.reply button{
  border:0;
  background:#e11d48;
  color:white;
  padding:0 18px;
  border-radius:10px;
  font-weight:bold;
}

.status{
  padding:30px;
  text-align:center;
  color:#777;
}

@media(max-width:700px){

  .users{
    grid-template-columns:1fr;
  }

  .user-list{
    border-right:0;
    border-bottom:1px solid #eee;
    max-height:180px;
  }

  .messages{
    min-height:400px;
    max-height:400px;
  }

}

</style>

</head>

<body>

<header>
  <h1>👨‍💻 Admin Chat Support</h1>
</header>

<div class="container">

  <div class="panel">

    <div class="top">
      💬 User Support Messages
    </div>

    <div class="users">

      <div id="userList" class="user-list">
        <div class="status">
          Loading users...
        </div>
      </div>

      <div class="chat">

        <div id="chatHeader" class="chat-header">
          Select a user
        </div>

        <div id="messages" class="messages">
          <div class="status">
            Select a user to view messages.
          </div>
        </div>

        <div class="reply">

          <textarea
            id="replyInput"
            placeholder="Write your reply..."
            disabled
          ></textarea>

          <button
            id="replyBtn"
            disabled
          >
            Reply
          </button>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://etkqkptoxkfhxcysaadi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0a3FrcHRveGtmaHhjeXNhYWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTAzMjIsImV4cCI6MjEwMzY2NjMyMn0.HXBJkxIvbELW4XmJB4bsve5u_XpD21B8XNX5ODIsufA";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const userList =
  document.getElementById("userList");

const messagesBox =
  document.getElementById("messages");

const chatHeader =
  document.getElementById("chatHeader");

const replyInput =
  document.getElementById("replyInput");

const replyBtn =
  document.getElementById("replyBtn");

let selectedUser = null;


/* =====================================
   ADMIN EMAIL
   ===================================== */

const ADMIN_EMAIL = "hossain.islam1996@gmail.com";


/* =====================================
   CHECK ADMIN
   ===================================== */

async function checkAdmin(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(!session){

    document.body.innerHTML = `
      <div class="status">
        🔐 Please login first.
      </div>
    `;

    return false;
  }

  if(session.user.email !== ADMIN_EMAIL){

    document.body.innerHTML = `
      <div class="status">
        🚫 Access denied.
      </div>
    `;

    return false;
  }

  return true;
}


/* =====================================
   LOAD USERS
   ===================================== */

async function loadUsers(){

  const {data,error} =
    await supabaseClient
      .from("support_messages")
      .select("user_id")
      .order("created_at",{ascending:false});

  if(error){

    userList.innerHTML = `
      <div class="status">
        ❌ Could not load users.
      </div>
    `;

    console.error(error);

    return;
  }

  const uniqueUsers =
    [...new Set(data.map(x => x.user_id))];

  userList.innerHTML = "";

  if(uniqueUsers.length === 0){

    userList.innerHTML = `
      <div class="status">
        No support messages yet.
      </div>
    `;

    return;
  }

  uniqueUsers.forEach(userId => {

    const div =
      document.createElement("div");

    div.className = "user-item";

    div.innerHTML = `
      <strong>👤 User</strong>
      <div class="user-id">
        ${userId}
      </div>
    `;

    div.onclick = () => {

      document
        .querySelectorAll(".user-item")
        .forEach(x =>
          x.classList.remove("active")
        );

      div.classList.add("active");

      selectUser(userId);
    };

    userList.appendChild(div);

  });

}


/* =====================================
   SELECT USER
   ===================================== */

async function selectUser(userId){

  selectedUser = userId;

  chatHeader.textContent =
    "💬 User: " + userId;

  replyInput.disabled = false;
  replyBtn.disabled = false;

  await loadMessages();

}


/* =====================================
   LOAD MESSAGES
   ===================================== */

async function loadMessages(){

  if(!selectedUser) return;

  const {data,error} =
    await supabaseClient
      .from("support_messages")
      .select("*")
      .eq("user_id",selectedUser)
      .order("created_at",{ascending:true});

  if(error){

    messagesBox.innerHTML = `
      <div class="status">
        ❌ Could not load messages.
      </div>
    `;

    console.error(error);

    return;
  }

  messagesBox.innerHTML = "";

  data.forEach(msg => {

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (msg.sender === "admin"
        ? "admin"
        : "user");

    const text =
      document.createElement("div");

    text.textContent =
      msg.message;

    const time =
      document.createElement("span");

    time.className = "time";

    time.textContent =
      new Date(
        msg.created_at
      ).toLocaleString();

    div.appendChild(text);
    div.appendChild(time);

    messagesBox.appendChild(div);

  });

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =====================================
   SEND REPLY
   ===================================== */

async function sendReply(){

  if(!selectedUser) return;

  const message =
    replyInput.value.trim();

  if(!message) return;

  replyBtn.disabled = true;

  const {error} =
    await supabaseClient
      .from("support_messages")
      .insert({

        user_id:selectedUser,

        message:message,

        sender:"admin"

      });

  if(error){

    alert(
      "❌ Reply failed."
    );

    console.error(error);

  }else{

    replyInput.value = "";

    await loadMessages();

  }

  replyBtn.disabled = false;

}


replyBtn.addEventListener(
  "click",
  sendReply
);


replyInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendReply();

    }

  }
);


/* =====================================
   START
   ===================================== */

async function start(){

  const allowed =
    await checkAdmin();

  if(!allowed) return;

  await loadUsers();

}

start();

</script>

</body>
</html>
