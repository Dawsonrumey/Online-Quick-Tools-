<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Support Panel - Online Quick Tools</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body.dark{
    background:#111827;
    color:#f9fafb;
}

.header{
    background:#e11d48;
    color:white;
    padding:15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:21px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:15px auto;
    padding:0 10px;
}

.login-card,
.panel{
    background:white;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
    padding:15px;
}

body.dark .login-card,
body.dark .panel{
    background:#1f2937;
}

input,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    font-size:14px;
}

body.dark input,
body.dark textarea{
    background:#111827;
    color:white;
    border-color:#4b5563;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    background:#e11d48;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.hidden{
    display:none!important;
}

.layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:15px;
}

.users{
    max-height:70vh;
    overflow-y:auto;
}

.user-item{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    cursor:pointer;
    border-radius:9px;
    margin-bottom:5px;
}

body.dark .user-item{
    border-color:#374151;
}

.user-item:hover,
.user-item.active{
    background:#ffe4e6;
}

body.dark .user-item:hover,
body.dark .user-item.active{
    background:#4c1d2a;
}

.user-name{
    font-weight:bold;
}

.user-preview{
    font-size:12px;
    opacity:.7;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-header{
    padding-bottom:12px;
    border-bottom:1px solid #e5e7eb;
    margin-bottom:10px;
}

body.dark .chat-header{
    border-color:#374151;
}

.chat-header h2{
    margin:0;
    font-size:18px;
}

.chat-header small{
    opacity:.7;
}

#chatBox{
    height:55vh;
    min-height:350px;
    overflow-y:auto;
    padding:8px;
}

.message{
    display:flex;
    margin:10px 0;
}

.message.user{
    justify-content:flex-start;
}

.message.admin{
    justify-content:flex-end;
}

.bubble{
    max-width:75%;
    padding:10px 13px;
    border-radius:14px;
    word-wrap:break-word;
}

.user .bubble{
    background:#e5e7eb;
    color:#111827;
    border-bottom-left-radius:4px;
}

.admin .bubble{
    background:#e11d48;
    color:white;
    border-bottom-right-radius:4px;
}

body.dark .user .bubble{
    background:#374151;
    color:#f9fafb;
}

.sender{
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
    opacity:.75;
}

.time{
    font-size:10px;
    margin-top:5px;
    opacity:.7;
    text-align:right;
}

.composer{
    display:flex;
    gap:8px;
    margin-top:10px;
}

#replyInput{
    min-height:48px;
    max-height:120px;
    resize:none;
    flex:1;
}

.notice{
    text-align:center;
    padding:30px 10px;
    color:#6b7280;
}

.error{
    color:#dc2626;
    font-size:13px;
    margin-top:10px;
}

.success{
    color:#16a34a;
    font-size:13px;
    margin-top:10px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.logout{
    background:#374151;
}

@media(max-width:700px){

    .layout{
        grid-template-columns:1fr;
    }

    .users{
        max-height:250px;
    }

    #chatBox{
        height:50vh;
    }

    .bubble{
        max-width:88%;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🛠️ Online Quick Tools Admin Panel</h1>
    <p>Private Support Management</p>
</div>

<div class="container">

    <!-- LOGIN -->
    <div id="loginCard" class="login-card">

        <h2>Admin Login</h2>

        <input
            id="email"
            type="email"
            value="dawson.rumey1996@gmail.com"
            placeholder="Admin email">

        <br><br>

        <input
            id="password"
            type="password"
            placeholder="Password">

        <br><br>

        <button id="loginBtn">
            Login
        </button>

        <div id="loginError" class="error"></div>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="hidden">

        <div class="topbar">

            <div>
                <strong>🟢 Admin Online</strong>
                <div id="adminEmail"></div>
            </div>

            <button
                class="logout"
                id="logoutBtn">
                Logout
            </button>

        </div>


        <div class="layout">

            <!-- USERS -->
            <div class="panel">

                <h3>👥 Users</h3>

                <div id="userList" class="users">
                    <div class="notice">
                        Loading users...
                    </div>
                </div>

            </div>


            <!-- CHAT -->
            <div class="panel">

                <div class="chat-header">

                    <h2 id="selectedUserName">
                        Select a user
                    </h2>

                    <small id="selectedUserId">
                    </small>

                </div>


                <div id="chatBox">

                    <div class="notice">
                        Select a user to view messages.
                    </div>

                </div>


                <div class="composer">

                    <textarea
                        id="replyInput"
                        placeholder="Write your reply..."
                        maxlength="2000"
                        disabled></textarea>

                    <button
                        id="replyBtn"
                        disabled>
                        Reply
                    </button>

                </div>

                <div id="replyStatus"></div>

            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const ADMIN_EMAIL =
    "dawson.rumey1996@gmail.com";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginCard =
    document.getElementById("loginCard");

const adminPanel =
    document.getElementById("adminPanel");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginError =
    document.getElementById("loginError");

const userList =
    document.getElementById("userList");

const chatBox =
    document.getElementById("chatBox");

const selectedUserName =
    document.getElementById("selectedUserName");

const selectedUserId =
    document.getElementById("selectedUserId");

const replyInput =
    document.getElementById("replyInput");

const replyBtn =
    document.getElementById("replyBtn");

const replyStatus =
    document.getElementById("replyStatus");

const adminEmail =
    document.getElementById("adminEmail");


let currentAdmin = null;
let selectedUser = null;
let realtimeChannel = null;
let userMap = new Map();
let loadedMessageIds = new Set();


function escapeHtml(text){

    if(!text){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(date){

    return new Date(date).toLocaleString(
        undefined,
        {
            month:"numeric",
            day:"numeric",
            year:"2-digit",
            hour:"numeric",
            minute:"2-digit"
        }
    );
}


/* LOGIN */

async function login(){

    loginError.textContent = "";

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(email !== ADMIN_EMAIL){

        loginError.textContent =
            "Only the authorized admin account can access this panel.";

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

    if(error){

        loginError.textContent =
            error.message;

        return;
    }

    currentAdmin =
        data.user;

    await showAdminPanel();
}


/* ADMIN PANEL */

async function showAdminPanel(){

    if(!currentAdmin){
        return;
    }

    if(currentAdmin.email !== ADMIN_EMAIL){

        await supabaseClient.auth.signOut();

        loginError.textContent =
            "Unauthorized account.";

        return;
    }

    loginCard.classList.add("hidden");

    adminPanel.classList.remove("hidden");

    adminEmail.textContent =
        currentAdmin.email;

    await loadUsers();

    setupRealtime();
}


/* LOAD USERS */

async function loadUsers(){

    userList.innerHTML = `
        <div class="notice">
            Loading users...
        </div>
    `;

    const {data,error} =
        await supabaseClient
        .from("community_messages")
        .select(`
            id,
            user_id,
            username,
            message,
            created_at,
            sender_type,
            reply_to_user_id
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );

    if(error){

        console.error(error);

        userList.innerHTML = `
            <div class="notice">
                ❌ ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    userMap.clear();

    for(const msg of data || []){

        let uid = null;

        if(
            msg.sender_type === "admin" &&
            msg.reply_to_user_id
        ){

            uid =
                msg.reply_to_user_id;

        }else if(
            msg.user_id !== currentAdmin.id
        ){

            uid =
                msg.user_id;
        }

        if(!uid){
            continue;
        }

        if(!userMap.has(uid)){

            userMap.set(
                uid,
                {
                    id:uid,
                    username:
                        msg.username ||
                        "User",
                    lastMessage:
                        msg.message || "",
                    created_at:
                        msg.created_at
                }
            );
        }
    }

    renderUserList();
}


function renderUserList(){

    userList.innerHTML = "";

    if(userMap.size === 0){

        userList.innerHTML = `
            <div class="notice">
                No users yet.
            </div>
        `;

        return;
    }

    userMap.forEach(user => {

        const item =
            document.createElement("div");

        item.className =
            "user-item" +
            (
                selectedUser &&
                selectedUser.id === user.id
                ? " active"
                : ""
            );

        item.dataset.userId =
            user.id;

        item.innerHTML = `

            <div class="user-name">
                👤 ${escapeHtml(user.username)}
            </div>

            <div class="user-preview">
                ${escapeHtml(user.lastMessage)}
            </div>

        `;

        item.addEventListener(
            "click",
            () => selectUser(user)
        );

        userList.appendChild(item);
    });
}


/* SELECT USER */

async function selectUser(user){

    selectedUser =
        user;

    selectedUserName.textContent =
        user.username;

    selectedUserId.textContent =
        user.id;

    replyInput.disabled =
        false;

    replyBtn.disabled =
        false;

    replyInput.value = "";

    replyStatus.textContent = "";

    document
        .querySelectorAll(".user-item")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.userId === user.id
            );

        });

    await loadSelectedUserMessages();
}


/* LOAD SELECTED USER CHAT */

async function loadSelectedUserMessages(){

    if(!selectedUser){
        return;
    }

    chatBox.innerHTML = `
        <div class="notice">
            Loading conversation...
        </div>
    `;

    loadedMessageIds.clear();

    const {data,error} =
        await supabaseClient
        .from("community_messages")
        .select(`
            id,
            user_id,
            username,
            message,
            image_url,
            created_at,
            sender_type,
            reply_to_user_id
        `)
        .or(
            `user_id.eq.${selectedUser.id},reply_to_user_id.eq.${selectedUser.id}`
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );

    if(error){

        console.error(error);

        chatBox.innerHTML = `
            <div class="notice">
                ❌ ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    chatBox.innerHTML = "";

    if(!data || data.length === 0){

        chatBox.innerHTML = `
            <div class="notice">
                No messages in this conversation.
            </div>
        `;

        return;
    }

    for(const message of data){

        renderMessage(message);
    }

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* RENDER MESSAGE */

function renderMessage(message){

    if(!message){
        return;
    }

    if(loadedMessageIds.has(message.id)){
        return;
    }

    loadedMessageIds.add(message.id);

    if(!selectedUser){
        return;
    }

    const belongsToSelectedUser =
        message.user_id === selectedUser.id ||
        message.reply_to_user_id === selectedUser.id;

    if(!belongsToSelectedUser){
        return;
    }

    const isAdmin =
        message.sender_type === "admin";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (isAdmin ? "admin" : "user");

    const sender =
        isAdmin
        ? "Admin"
        : (
            message.username ||
            selectedUser.username ||
            "User"
        );

    wrapper.innerHTML = `

        <div class="bubble">

            <div class="sender">
                ${escapeHtml(sender)}
            </div>

            <div>
                ${escapeHtml(message.message)}
            </div>

            <div class="time">
                ${formatTime(message.created_at)}
            </div>

        </div>

    `;

    chatBox.appendChild(wrapper);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* ADMIN REPLY */

async function sendReply(){

    if(!currentAdmin){

        alert("Admin login required.");
        return;
    }

    if(!selectedUser){

        alert("Please select a user first.");
        return;
    }

    const message =
        replyInput.value.trim();

    if(!message){
        return;
    }

    replyBtn.disabled = true;
    replyBtn.textContent = "Sending...";
    replyStatus.textContent = "";

    const {data,error} =
        await supabaseClient
        .from("community_messages")
        .insert({

            user_id:
                currentAdmin.id,

            username:
                "Admin",

            message:
                message,

            image_url:
                null,

            sender_type:
                "admin",

            reply_to_user_id:
                selectedUser.id

        })
        .select()
        .single();

    if(error){

        console.error(error);

        replyStatus.className =
            "error";

        replyStatus.textContent =
            "❌ Reply failed: " +
            error.message;

    }else{

        replyInput.value = "";

        replyStatus.className =
            "success";

        replyStatus.textContent =
            "✅ Reply sent successfully.";

        renderMessage(data);

        setTimeout(() => {

            replyStatus.textContent = "";

        },3000);
    }

    replyBtn.disabled = false;
    replyBtn.textContent = "Reply";
}


/* REALTIME */

function setupRealtime(){

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );
    }

    realtimeChannel =
        supabaseClient
        .channel(
            "admin-support-realtime"
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"community_messages"
            },
            async payload => {

                const message =
                    payload.new;

                /* Update user list */

                let uid = null;

                if(
                    message.sender_type === "admin" &&
                    message.reply_to_user_id
                ){

                    uid =
                        message.reply_to_user_id;

                }else if(
                    message.user_id !== currentAdmin.id
                ){

                    uid =
                        message.user_id;
                }

                if(uid){

                    if(!userMap.has(uid)){

                        userMap.set(
                            uid,
                            {
                                id:uid,
                                username:
                                    message.username ||
                                    "User",
                                lastMessage:
                                    message.message || "",
                                created_at:
                                    message.created_at
                            }
                        );

                    }else{

                        const user =
                            userMap.get(uid);

                        user.lastMessage =
                            message.message || "";

                        user.created_at =
                            message.created_at;
                    }

                    renderUserList();
                }


                /* Update selected conversation */

                if(
                    selectedUser &&
                    (
                        message.user_id ===
                            selectedUser.id
                        ||
                        message.reply_to_user_id ===
                            selectedUser.id
                    )
                ){

                    renderMessage(message);

                    chatBox.scrollTop =
                        chatBox.scrollHeight;
                }

            }
        )
        .subscribe();
}


/* LOGOUT */

async function logout(){

    if(realtimeChannel){

        await supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;
    }

    await supabaseClient.auth.signOut();

    currentAdmin = null;
    selectedUser = null;

    adminPanel.classList.add("hidden");
    loginCard.classList.remove("hidden");

    passwordInput.value = "";
}


/* EVENTS */

loginBtn.addEventListener(
    "click",
    login
);

logoutBtn.addEventListener(
    "click",
    logout
);

replyBtn.addEventListener(
    "click",
    sendReply
);


replyInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendReply();
        }
    }
);


/* CHECK SESSION */

async function init(){

    const {
        data
    } =
        await supabaseClient.auth.getSession();

    if(data.session?.user){

        if(
            data.session.user.email ===
            ADMIN_EMAIL
        ){

            currentAdmin =
                data.session.user;

            await showAdminPanel();

        }else{

            await supabaseClient.auth.signOut();
        }
    }
}


supabaseClient.auth.onAuthStateChange(
    async (event,session) => {

        if(
            session?.user &&
            session.user.email ===
            ADMIN_EMAIL
        ){

            currentAdmin =
                session.user;

        }
    }
);


init();

</script>

</body>
</html>
