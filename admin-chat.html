<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Chat - Online Quick Tools</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:#e11d48;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:22px;
}

.login-box{
    max-width:420px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.login-box h2{
    text-align:center;
    margin-top:0;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:9px;
    background:#e11d48;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.login-box button:disabled{
    opacity:.6;
}

.login-error{
    color:#dc2626;
    text-align:center;
    margin-top:12px;
}

.admin-panel{
    display:none;
    max-width:1000px;
    margin:20px auto;
    padding:0 12px;
}

.panel{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.panel-top{
    padding:15px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    border:0;
    background:#ef4444;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.new-message-alert{
    display:none;
    background:#dc2626;
    color:white;
    padding:11px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
}

.new-message-alert.show{
    display:block;
}

.users{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:600px;
}

.user-list{
    border-right:1px solid #eee;
    overflow-y:auto;
}

.user-item{
    padding:14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    position:relative;
}

.user-item:hover,
.user-item.active{
    background:#fff1f2;
}

.user-name{
    font-weight:bold;
    display:block;
    padding-right:30px;
}

.user-id{
    font-size:10px;
    color:#777;
    margin-top:4px;
    word-break:break-all;
}

.unread-badge{
    position:absolute;
    right:12px;
    top:13px;
    min-width:22px;
    height:22px;
    padding:2px 6px;
    border-radius:20px;
    background:#dc2626;
    color:white;
    font-size:12px;
    font-weight:bold;
    text-align:center;
    line-height:18px;
}

.chat{
    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:14px;
    border-bottom:1px solid #eee;
    font-weight:bold;
}

.messages{
    flex:1;
    min-height:470px;
    max-height:470px;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:14px;
    line-height:1.4;
    word-break:break-word;
}

.message.user{
    align-self:flex-start;
    background:#eef1f5;
}

.message.admin{
    align-self:flex-end;
    background:#e11d48;
    color:white;
}

.username{
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
    opacity:.85;
}

.time{
    display:block;
    font-size:10px;
    opacity:.7;
    margin-top:4px;
}

.reply{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid #eee;
}

.reply textarea{
    flex:1;
    resize:none;
    min-height:45px;
    max-height:120px;
    padding:11px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:inherit;
}

.reply button{
    border:0;
    background:#e11d48;
    color:white;
    padding:0 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.reply button:disabled{
    opacity:.6;
}

.status{
    padding:30px;
    text-align:center;
    color:#777;
}

@media(max-width:700px){

    .admin-panel{
        margin:12px auto;
    }

    .users{
        grid-template-columns:1fr;
        min-height:auto;
    }

    .user-list{
        border-right:0;
        border-bottom:1px solid #eee;
        max-height:210px;
    }

    .messages{
        min-height:400px;
        max-height:400px;
    }

    .message{
        max-width:88%;
    }

    .panel-top{
        padding:12px;
    }

    .reply{
        padding:10px;
    }

    .reply button{
        padding:0 14px;
    }
}

</style>

</head>

<body>

<header>

<h1>👨‍💻 Admin Chat Support</h1>

</header>


<!-- LOGIN -->

<div id="loginBox" class="login-box">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email"
autocomplete="email"
>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
>

<button id="loginBtn">
Login
</button>

<div
id="loginError"
class="login-error">
</div>

</div>


<!-- ADMIN PANEL -->

<div
id="adminPanel"
class="admin-panel"
>

<div class="panel">

<div class="panel-top">

<strong>
💬 Community Messages
</strong>

<button
class="logout"
id="logoutBtn"
>
Logout
</button>

</div>


<div
id="newMessageAlert"
class="new-message-alert"
>
🔔 New message received — Tap to view
</div>


<div class="users">


<!-- USERS -->

<div
id="userList"
class="user-list"
>

<div class="status">
Loading users...
</div>

</div>


<!-- CHAT -->

<div class="chat">

<div
id="chatHeader"
class="chat-header"
>
Select a user
</div>


<div
id="messages"
class="messages"
>

<div class="status">
Select a user to view messages.
</div>

</div>


<div class="reply">

<textarea
id="replyInput"
placeholder="Write admin reply..."
disabled
></textarea>

<button
id="replyBtn"
disabled
>
Reply
</button>

</div>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   ADMIN EMAIL
===================================== */

const ADMIN_EMAIL =
"dawson.rumey1996@gmail.com";


/* =====================================
   ELEMENTS
===================================== */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");

const logoutBtn =
document.getElementById("logoutBtn");

const userList =
document.getElementById("userList");

const messagesBox =
document.getElementById("messages");

const chatHeader =
document.getElementById("chatHeader");

const replyInput =
document.getElementById("replyInput");

const replyBtn =
document.getElementById("replyBtn");

const newMessageAlert =
document.getElementById("newMessageAlert");


/* =====================================
   VARIABLES
===================================== */

let currentAdmin = null;

let selectedUser = null;

let selectedUsername = "";

let realtimeChannel = null;

let unreadUsers = {};


/* =====================================
   LOGIN
===================================== */

async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    loginError.textContent = "";


    if(!email || !password){

        loginError.textContent =
            "Please enter email and password.";

        return;

    }


    if(
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        loginError.textContent =
            "🚫 Access denied.";

        return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
        "Logging in...";


    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        loginError.textContent =
            "❌ " + error.message;

        loginBtn.disabled = false;

        loginBtn.textContent =
            "Login";

        return;

    }


    if(
        !data.user ||
        !data.user.email ||
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient.auth.signOut();

        loginError.textContent =
            "🚫 Access denied.";

        loginBtn.disabled = false;

        loginBtn.textContent =
            "Login";

        return;

    }


    currentAdmin =
        data.user;


    await showAdminPanel();

}


/* =====================================
   SHOW PANEL
===================================== */

async function showAdminPanel(){

    loginBox.style.display =
        "none";

    adminPanel.style.display =
        "block";

    await loadUsers();

    setupRealtime();

}


/* =====================================
   CHECK SESSION
===================================== */

async function checkSession(){

    const {
        data:{session}
    } =
        await supabaseClient.auth.getSession();


    if(
        session &&
        session.user &&
        session.user.email &&
        session.user.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase()
    ){

        currentAdmin =
            session.user;

        await showAdminPanel();

    }

}


/* =====================================
   LOAD USERS FROM
   COMMUNITY_MESSAGES
===================================== */

async function loadUsers(){

    userList.innerHTML = `
        <div class="status">
            Loading users...
        </div>
    `;


    const {data,error} =
        await supabaseClient
            .from("community_messages")
            .select(
                "user_id,username,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "Users load error:",
            error
        );

        userList.innerHTML = `
            <div class="status">
                ❌ Could not load users.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;

    }


    /*
       Create unique users
    */

    const users = [];

    const seen = new Set();


    data.forEach(row => {

        if(!row.user_id)
            return;


        /*
           Do not show admin as a user
        */

        if(
            currentAdmin &&
            row.user_id === currentAdmin.id
        ){

            return;

        }


        if(!seen.has(row.user_id)){

            seen.add(row.user_id);

            users.push({

                user_id:
                    row.user_id,

                username:
                    row.username ||
                    "User"

            });

        }

    });


    userList.innerHTML = "";


    if(users.length === 0){

        userList.innerHTML = `
            <div class="status">
                No user messages yet.
            </div>
        `;

        return;

    }


    users.forEach(user => {

        const div =
            document.createElement("div");

        div.className =
            "user-item";


        if(
            selectedUser ===
            user.user_id
        ){

            div.classList.add("active");

        }


        const name =
            document.createElement("span");

        name.className =
            "user-name";

        name.textContent =
            "👤 " +
            user.username;


        const id =
            document.createElement("div");

        id.className =
            "user-id";

        id.textContent =
            user.user_id;


        div.appendChild(name);

        div.appendChild(id);


        const unread =
            unreadUsers[user.user_id] || 0;


        if(unread > 0){

            const badge =
                document.createElement("span");

            badge.className =
                "unread-badge";

            badge.textContent =
                unread > 99
                ? "99+"
                : unread;

            div.appendChild(badge);

        }


        div.addEventListener(
            "click",
            async function(){

                selectedUser =
                    user.user_id;

                selectedUsername =
                    user.username;


                unreadUsers[
                    user.user_id
                ] = 0;


                document
                    .querySelectorAll(".user-item")
                    .forEach(item =>
                        item.classList.remove(
                            "active"
                        )
                    );


                div.classList.add(
                    "active"
                );


                chatHeader.textContent =
                    "💬 " +
                    selectedUsername;


                replyInput.disabled =
                    false;

                replyBtn.disabled =
                    false;


                await loadSelectedUserMessages();


                newMessageAlert.classList.remove(
                    "show"
                );

            }
        );


        userList.appendChild(div);

    });

}


/* =====================================
   LOAD SELECTED USER MESSAGES
===================================== */

async function loadSelectedUserMessages(){

    if(!selectedUser)
        return;


    const {data,error} =
        await supabaseClient
            .from("community_messages")
            .select(
                "id,user_id,username,message,image_url,created_at"
            )
            .eq(
                "user_id",
                selectedUser
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(error){

        messagesBox.innerHTML = `
            <div class="status">
                ❌ Could not load messages.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        console.error(error);

        return;

    }


    messagesBox.innerHTML = "";


    if(
        !data ||
        data.length === 0
    ){

        messagesBox.innerHTML = `
            <div class="status">
                No messages.
            </div>
        `;

        return;

    }


    data.forEach(
        addMessage
    );


    scrollBottom();

}


/* =====================================
   ADD MESSAGE
===================================== */

function addMessage(msg){

    const div =
        document.createElement("div");


    /*
       Admin message =
       current admin user ID
    */

    const isAdmin =
        currentAdmin &&
        msg.user_id ===
        currentAdmin.id;


    div.className =
        "message " +
        (
            isAdmin
            ? "admin"
            : "user"
        );


    const username =
        document.createElement("div");

    username.className =
        "username";

    username.textContent =
        isAdmin
        ? "👨‍💻 Admin"
        : "👤 " +
          (msg.username || "User");


    const text =
        document.createElement("div");

    text.textContent =
        msg.message || "";


    const time =
        document.createElement("span");

    time.className =
        "time";

    time.textContent =
        new Date(
            msg.created_at
        ).toLocaleString();


    div.appendChild(username);

    div.appendChild(text);

    div.appendChild(time);


    messagesBox.appendChild(div);

}


/* =====================================
   ADMIN REPLY
===================================== */

async function sendReply(){

    if(!selectedUser)
        return;


    const message =
        replyInput.value.trim();


    if(!message)
        return;


    if(!currentAdmin)
        return;


    replyBtn.disabled =
        true;


    const {error} =
        await supabaseClient
            .from("community_messages")
            .insert({

                user_id:
                    currentAdmin.id,

                username:
                    "Admin",

                message:
                    message,

                image_url:
                    null

            });


    if(error){

        alert(
            "❌ Reply failed: " +
            error.message
        );

        console.error(error);

    }else{

        replyInput.value = "";

        /*
           Admin message is public
           community chat.
        */

        await loadSelectedUserMessages();

    }


    replyBtn.disabled =
        false;

}


/* =====================================
   REALTIME
===================================== */

function setupRealtime(){

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "admin-community-chat"
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"community_messages"
                },

                async payload => {

                    const msg =
                        payload.new;


                    /*
                       Admin's own message
                    */

                    if(
                        currentAdmin &&
                        msg.user_id ===
                        currentAdmin.id
                    ){

                        if(
                            selectedUser
                        ){

                            /*
                               Reload so admin
                               reply appears.
                            */

                            await loadSelectedUserMessages();

                        }

                        return;

                    }


                    /*
                       New user message
                    */

                    if(
                        msg.user_id
                    ){

                        unreadUsers[
                            msg.user_id
                        ] =
                            (
                                unreadUsers[
                                    msg.user_id
                                ] || 0
                            ) + 1;


                        newMessageAlert.classList.add(
                            "show"
                        );


                        document.title =
                            "🔴 New Message - Admin Chat";


                        await loadUsers();


                        /*
                           If this user is
                           currently selected,
                           reload immediately.
                        */

                        if(
                            selectedUser ===
                            msg.user_id
                        ){

                            unreadUsers[
                                msg.user_id
                            ] = 0;


                            await loadSelectedUserMessages();

                        }

                    }

                }

            )

            .subscribe(
                status => {

                    console.log(
                        "Admin realtime:",
                        status
                    );

                }
            );

}


/* =====================================
   ALERT
===================================== */

newMessageAlert.addEventListener(
    "click",
    async function(){

        newMessageAlert.classList.remove(
            "show"
        );

        document.title =
            "Admin Chat - Online Quick Tools";

        await loadUsers();

    }
);


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    if(realtimeChannel){

        await supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }


    await supabaseClient.auth.signOut();

    location.reload();

}


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* =====================================
   SCROLL
===================================== */

function scrollBottom(){

    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


/* =====================================
   EVENTS
===================================== */

loginBtn.addEventListener(
    "click",
    login
);


logoutBtn.addEventListener(
    "click",
    logout
);


passwordInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            login();

        }

    }
);


replyBtn.addEventListener(
    "click",
    sendReply
);


replyInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendReply();

        }

    }
);


/* =====================================
   START
===================================== */

checkSession();

</script>

</body>
</html>
