<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Feed — Online Quick Tools</title>

<meta name="description"
      content="Browse and share images on Online Quick Tools Image Feed.">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --button: #f3f4f6;
    --primary: #2563eb;
    --danger: #ef4444;
    --shadow: 0 3px 15px rgba(0,0,0,.08);
}

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151;
    --button: #374151;
    --primary: #60a5fa;
    --danger: #f87171;
    --shadow: 0 3px 15px rgba(0,0,0,.25);
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
}

.nav {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.nav button {
    border: 1px solid var(--border);
    background: var(--button);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

.nav button:hover {
    opacity: .85;
}


/* =========================================================
   MAIN
========================================================= */

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 20px 12px 50px;
}

.feed-title {
    text-align: center;
    margin-bottom: 18px;
}

.feed-title h1 {
    font-size: 27px;
    margin-bottom: 6px;
}

.feed-title p {
    color: var(--muted);
    font-size: 14px;
}


/* =========================================================
   UPLOAD
========================================================= */

.upload-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.upload-card h2 {
    font-size: 18px;
    margin-bottom: 10px;
}

.upload-info {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 12px;
}

.file-input {
    width: 100%;
    margin-bottom: 12px;
}

.upload-btn {
    width: 100%;
    border: 0;
    background: var(--primary);
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.upload-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.login-message {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 10px;
}


/* =========================================================
   MODERATION NOTICE
========================================================= */

.moderation-note {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--button);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}


/* =========================================================
   FEED
========================================================= */

.feed {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.image-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
}


/* =========================================================
   POST HEADER
========================================================= */

.post-header {
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
    flex-shrink: 0;
}

.post-user {
    min-width: 0;
}

.post-user strong {
    display: block;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.post-time {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}


/* =========================================================
   IMAGE
========================================================= */

.post-image-wrap {
    width: 100%;
    background: #000;
}

.post-image {
    display: block;
    width: 100%;
    max-height: 700px;
    object-fit: contain;
    margin: auto;
}


/* =========================================================
   REACTIONS
========================================================= */

.reaction-summary {
    padding: 10px 14px 6px;
    color: var(--muted);
    font-size: 13px;
    border-bottom: 1px solid var(--border);
}

.reaction-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 9px;
}

.reaction-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 9px 4px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
}

.reaction-btn:hover {
    background: var(--button);
}

.reaction-btn.active {
    background: var(--button);
    color: var(--primary);
}

.reaction-btn.love-active {
    background: var(--button);
    color: var(--danger);
}


/* =========================================================
   STATES
========================================================= */

.loading,
.empty,
.error-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 25px 15px;
    text-align: center;
    color: var(--muted);
}

.spinner {
    width: 30px;
    height: 30px;
    margin: 0 auto 10px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

.load-more {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
}

.load-more:disabled {
    opacity: .5;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(100px);
    background: #111827;
    color: white;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 2000;
    transition: .3s ease;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .header-inner {
        flex-direction: column;
        align-items: stretch;
    }

    .logo {
        text-align: center;
    }

    .nav {
        justify-content: center;
    }

    .nav button {
        font-size: 13px;
        padding: 8px 10px;
    }

    .container {
        padding-top: 15px;
    }

    .feed-title h1 {
        font-size: 24px;
    }

    .post-image {
        max-height: 600px;
    }

}


@media (max-width: 420px) {

    .nav button {
        font-size: 12px;
        padding: 7px 8px;
    }

    .reaction-btn {
        font-size: 13px;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header-inner">

        <div class="logo"
             onclick="window.location.href='index.html'">

            ⚡ Online Quick Tools

        </div>


        <div class="nav">

            <button
                onclick="window.location.href='index.html'">

                🏠 Home

            </button>


            <button
                id="authButton"
                onclick="handleAuthButton()">

                👤 Login

            </button>


            <button
                onclick="toggleTheme()"
                title="Toggle theme">

                🌙

            </button>

        </div>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


    <div class="feed-title">

        <h1>🖼️ Image Feed</h1>

        <p>
            Latest approved images shared by our community
        </p>

    </div>


    <div id="uploadArea"></div>


    <div id="feed" class="feed">

        <div class="loading">

            <div class="spinner"></div>

            Loading images...

        </div>

    </div>


    <button
        id="loadMoreBtn"
        class="load-more"
        onclick="loadMoreImages()"
        style="display:none;">

        Load More

    </button>


</main>


<div id="toast" class="toast"></div>



<!-- =======================================================
     SUPABASE
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://etkqkptoxkfhxcysaadi.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =========================================================
   CONFIG
========================================================= */

const BUCKET_NAME =
    "images";


const IMAGES_TABLE =
    "images";


const REACTIONS_TABLE =
    "image_reactions";


const PROFILES_TABLE =
    "profiles";


const PAGE_SIZE =
    8;



/* =========================================================
   STATE
========================================================= */

let currentOffset = 0;

let loadingImages = false;

let hasMoreImages = true;

let currentUser = null;



/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    }, 2800);

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   USER LABEL
========================================================= */

function getUserLabel(user) {

    if (!user) {

        return "Community User";

    }


    const metadata =
        user.user_metadata || {};


    return (

        metadata.username ||

        metadata.full_name ||

        metadata.name ||

        user.email ||

        "Community User"

    );

}



/* =========================================================
   PROFILE USERNAME
========================================================= */

/*
   This function gets the username from
   profiles table.

   images.user_id
        ↓
   profiles.id
        ↓
   profiles.username
*/

async function getProfileUsernames(userIds) {

    const usernameMap = {};


    if (
        !userIds ||
        userIds.length === 0
    ) {

        return usernameMap;

    }


    const uniqueIds =
        [...new Set(
            userIds
                .filter(Boolean)
                .map(id => String(id))
        )];


    if (
        uniqueIds.length === 0
    ) {

        return usernameMap;

    }


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from(PROFILES_TABLE)

            .select(
                "id,username"
            )

            .in(
                "id",
                uniqueIds
            );


        if (error) {

            console.warn(
                "Profile loading error:",
                error
            );

            return usernameMap;

        }


        (data || []).forEach(profile => {

            if (
                profile.id &&
                profile.username
            ) {

                usernameMap[
                    String(profile.id)
                ] =
                    profile.username;

            }

        });


    } catch (error) {

        console.warn(
            "Could not load usernames:",
            error
        );

    }


    return usernameMap;

}



/* =========================================================
   INITIAL
========================================================= */

function getInitialFromName(name) {

    if (!name) {

        return "U";

    }


    return (
        String(name)
            .trim()
            .charAt(0)
            .toUpperCase()
        || "U"
    );

}



/* =========================================================
   TIME
========================================================= */

function formatTime(dateString) {

    if (!dateString) {

        return "";

    }


    const date =
        new Date(dateString);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const now =
        new Date();


    const diff =
        Math.floor(
            (now - date) / 1000
        );


    if (diff < 60) {

        return "Just now";

    }


    if (diff < 3600) {

        const minutes =
            Math.floor(
                diff / 60
            );


        return minutes +

            (
                minutes === 1
                    ? " minute ago"
                    : " minutes ago"
            );

    }


    if (diff < 86400) {

        const hours =
            Math.floor(
                diff / 3600
            );


        return hours +

            (
                hours === 1
                    ? " hour ago"
                    : " hours ago"
            );

    }


    if (diff < 604800) {

        const days =
            Math.floor(
                diff / 86400
            );


        return days +

            (
                days === 1
                    ? " day ago"
                    : " days ago"
            );

    }


    return date.toLocaleDateString();

}



/* =========================================================
   THEME
========================================================= */

function loadTheme() {

    const saved =
        localStorage.getItem(
            "imageFeedTheme"
        );


    if (saved === "dark") {

        document.body.classList.add(
            "dark"
        );

    }

}



function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(

        "imageFeedTheme",

        document.body.classList.contains(
            "dark"
        )
            ? "dark"
            : "light"

    );

}



/* =========================================================
   AUTH
========================================================= */

async function loadAuth() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

    }


    currentUser =
        data?.session?.user || null;


    updateAuthUI();

    renderUploadArea();

}



/* =========================================================
   AUTH UI
========================================================= */

function updateAuthUI() {

    const button =
        document.getElementById(
            "authButton"
        );


    if (!button) {

        return;

    }


    button.textContent =

        currentUser

            ? "🚪 Logout"

            : "👤 Login";

}



/* =========================================================
   AUTH BUTTON
========================================================= */

function handleAuthButton() {

    if (currentUser) {

        logoutUser();

    } else {

        loginUser();

    }

}



/* =========================================================
   LOGIN
========================================================= */

async function loginUser() {

    const email =
        prompt(
            "Enter your email:"
        );


    if (!email) {

        return;

    }


    const password =
        prompt(
            "Enter your password:"
        );


    if (!password) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email.trim(),

                password:
                    password

            });


    if (error) {

        showToast(
            "Login failed: " +
            error.message
        );

        return;

    }


    showToast(
        "Login successful!"
    );


    await loadAuth();

}



/* =========================================================
   LOGOUT
========================================================= */

async function logoutUser() {

    const {
        error
    } =
        await supabaseClient
            .auth
            .signOut();


    if (error) {

        showToast(
            "Logout failed: " +
            error.message
        );

        return;

    }


    currentUser = null;


    updateAuthUI();

    renderUploadArea();


    showToast(
        "Logged out"
    );


    resetFeed();

    await loadImages(true);

}



/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(

        async (
            event,
            session
        ) => {


            currentUser =
                session?.user || null;


            updateAuthUI();

            renderUploadArea();


            resetFeed();

            await loadImages(true);


        }

    );



/* =========================================================
   UPLOAD AREA
========================================================= */

function renderUploadArea() {

    const area =
        document.getElementById(
            "uploadArea"
        );


    if (!area) {

        return;

    }


    if (!currentUser) {

        area.innerHTML = `

            <div class="upload-card">

                <div class="login-message">

                    🔐 Login to share your image

                </div>

            </div>

        `;

        return;

    }


    area.innerHTML = `

        <div class="upload-card">

            <h2>
                📤 Share an Image
            </h2>


            <div class="upload-info">

                JPG, PNG or WebP • Maximum 5 MB

            </div>


            <input
                id="imageFile"
                class="file-input"
                type="file"
                accept="image/jpeg,image/png,image/webp"
            >


            <button
                id="uploadBtn"
                class="upload-btn"
                onclick="uploadImage()">

                ⬆️ Upload Image

            </button>


            <div class="moderation-note">

                🛡️ Your image will be reviewed before
                appearing publicly.

            </div>

        </div>

    `;

}



/* =========================================================
   UPLOAD IMAGE
========================================================= */

async function uploadImage() {

    if (!currentUser) {

        showToast(
            "Please login first."
        );

        return;

    }


    const input =
        document.getElementById(
            "imageFile"
        );


    const button =
        document.getElementById(
            "uploadBtn"
        );


    if (
        !input ||
        !input.files.length
    ) {

        showToast(
            "Please select an image."
        );

        return;

    }


    const file =
        input.files[0];


    const allowedTypes = [

        "image/jpeg",

        "image/png",

        "image/webp"

    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        showToast(
            "Only JPG, PNG or WebP images are allowed."
        );

        return;

    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        showToast(
            "Maximum image size is 5 MB."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "⏳ Uploading...";


    try {


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const filePath =

            currentUser.id +

            "/" +

            crypto.randomUUID() +

            "." +

            extension;



        /* STORAGE */

        const {
            error: uploadError
        } =
            await supabaseClient

                .storage

                .from(BUCKET_NAME)

                .upload(

                    filePath,

                    file,

                    {

                        cacheControl:
                            "3600",

                        upsert:
                            false,

                        contentType:
                            file.type

                    }

                );


        if (uploadError) {

            throw uploadError;

        }



        /* PUBLIC URL */

        const {
            data: publicData
        } =
            supabaseClient

                .storage

                .from(BUCKET_NAME)

                .getPublicUrl(
                    filePath
                );


        const publicUrl =
            publicData?.publicUrl;


        if (!publicUrl) {

            throw new Error(
                "Could not create public image URL."
            );

        }



        /* DATABASE */

        const {
            error: dbError
        } =
            await supabaseClient

                .from(IMAGES_TABLE)

                .insert({

                    user_id:
                        currentUser.id,

                    file_path:
                        filePath,

                    public_url:
                        publicUrl,

                    status:
                        "pending"

                });


        if (dbError) {


            await supabaseClient

                .storage

                .from(BUCKET_NAME)

                .remove([
                    filePath
                ]);


            throw dbError;

        }



        showToast(
            "Image submitted! Waiting for approval. 🛡️"
        );


        input.value = "";


        resetFeed();

        await loadImages(true);


    } catch (error) {


        console.error(
            "Upload error:",
            error
        );


        showToast(
            "Upload failed: " +
            error.message
        );


    } finally {


        button.disabled =
            false;


        button.textContent =
            "⬆️ Upload Image";

    }

}



/* =========================================================
   RESET FEED
========================================================= */

function resetFeed() {

    currentOffset = 0;

    hasMoreImages = true;


    const feed =
        document.getElementById(
            "feed"
        );


    if (feed) {

        feed.innerHTML = "";

    }


    const loadMoreBtn =
        document.getElementById(
            "loadMoreBtn"
        );


    if (loadMoreBtn) {

        loadMoreBtn.style.display =
            "none";

    }

}



/* =========================================================
   LOAD APPROVED IMAGES
========================================================= */

async function loadImages(
    reset = false
) {


    if (loadingImages) {

        return;

    }


    if (
        !hasMoreImages &&
        !reset
    ) {

        return;

    }


    loadingImages = true;


    const feed =
        document.getElementById(
            "feed"
        );


    const loadMoreBtn =
        document.getElementById(
            "loadMoreBtn"
        );



    if (reset) {

        currentOffset = 0;

        hasMoreImages = true;


        feed.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Loading approved images...

            </div>

        `;

    }



    try {


        const from =
            currentOffset;


        const to =
            currentOffset +
            PAGE_SIZE -
            1;



        /* =================================================
           GET APPROVED IMAGES
        ================================================= */

        const {
            data: images,
            error
        } =
            await supabaseClient

                .from(IMAGES_TABLE)

                .select(
                    "id,user_id,file_path,public_url,created_at,status"
                )

                .eq(
                    "status",
                    "approved"
                )

                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                )

                .range(
                    from,
                    to
                );


        if (error) {

            throw error;

        }



        if (reset) {

            feed.innerHTML = "";

        }



        if (
            !images ||
            images.length === 0
        ) {


            if (reset) {

                feed.innerHTML = `

                    <div class="empty">

                        <div style="
                            font-size:40px;
                            margin-bottom:10px;
                        ">

                            🖼️

                        </div>


                        <strong>

                            No approved images yet

                        </strong>


                        <p style="
                            margin-top:6px;
                        ">

                            Be the first person to
                            share an image.

                        </p>

                    </div>

                `;

            }


            hasMoreImages =
                false;


            loadMoreBtn.style.display =
                "none";


            return;

        }



        /* =================================================
           GET USERNAMES FROM PROFILES
        ================================================= */

        const userIds =
            images.map(
                image =>
                    image.user_id
            );


        const usernameMap =
            await getProfileUsernames(
                userIds
            );



        /* =================================================
           REACTIONS
        ================================================= */

        const imageIds =
            images.map(
                image =>
                    image.id
            );


        let reactions = [];


        const {
            data: reactionData,
            error: reactionError
        } =
            await supabaseClient

                .from(REACTIONS_TABLE)

                .select(
                    "id,image_id,user_id,reaction"
                )

                .in(
                    "image_id",
                    imageIds
                );


        if (reactionError) {

            console.warn(
                "Reaction loading error:",
                reactionError
            );

        } else {

            reactions =
                reactionData || [];

        }



        /* =================================================
           CREATE IMAGE CARDS
        ================================================= */

        images.forEach(
            image => {


                const imageReactions =
                    reactions.filter(

                        reaction =>

                            String(
                                reaction.image_id
                            ) ===

                            String(
                                image.id
                            )

                    );


                const card =
                    createImageCard(

                        image,

                        imageReactions,

                        usernameMap

                    );


                feed.insertAdjacentHTML(

                    "beforeend",

                    card

                );

            }
        );



        currentOffset +=
            images.length;


        hasMoreImages =
            images.length ===
            PAGE_SIZE;


        loadMoreBtn.style.display =

            hasMoreImages

                ? "block"

                : "none";



    } catch (error) {


        console.error(
            "Gallery error:",
            error
        );


        if (reset) {

            feed.innerHTML = `

                <div class="error-box">

                    ❌ Could not load images.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

        } else {

            showToast(
                "Could not load more images."
            );

        }


    } finally {

        loadingImages = false;

    }

}



/* =========================================================
   IMAGE CARD
========================================================= */

function createImageCard(

    image,

    reactions,

    usernameMap

) {


    /* =====================================================
       REACTION COUNTS
    ===================================================== */

    const likeCount =
        reactions.filter(

            r =>
                r.reaction ===
                "like"

        ).length;


    const loveCount =
        reactions.filter(

            r =>
                r.reaction ===
                "love"

        ).length;


    const wowCount =
        reactions.filter(

            r =>
                r.reaction ===
                "wow"

        ).length;



    /* =====================================================
       MY REACTION
    ===================================================== */

    let myReaction = null;


    if (currentUser) {


        const mine =
            reactions.find(

                r =>

                    String(
                        r.user_id
                    ) ===

                    String(
                        currentUser.id
                    )

            );


        if (mine) {

            myReaction =
                mine.reaction;

        }

    }



    /* =====================================================
       USERNAME
    ===================================================== */

    const imageUserId =
        image.user_id
            ? String(image.user_id)
            : "";


    let userName =
        usernameMap?.[imageUserId]
        || null;



    /*
       If the logged-in user owns the image,
       use their profile username if available.
    */

    if (
        !userName &&
        currentUser &&
        String(currentUser.id) ===
        imageUserId
    ) {

        const metadata =
            currentUser.user_metadata
            || {};


        userName =

            metadata.username ||

            metadata.full_name ||

            metadata.name ||

            null;

    }



    /*
       Final fallback.
    */

    if (!userName) {

        userName =
            "Community User";

    }



    /* =====================================================
       AVATAR INITIAL
    ===================================================== */

    const initial =
        getInitialFromName(
            userName
        );



    /* =====================================================
       CREATE CARD
    ===================================================== */

    return `

        <article
            class="image-card"
            data-image-id="${escapeHtml(
                image.id
            )}"
        >


            <!-- POST HEADER -->

            <div class="post-header">


                <div class="avatar">

                    ${escapeHtml(
                        initial
                    )}

                </div>


                <div class="post-user">


                    <strong>

                        👤 ${escapeHtml(
                            userName
                        )}

                    </strong>


                    <div class="post-time">

                        ${escapeHtml(

                            formatTime(
                                image.created_at
                            )

                        )}

                    </div>


                </div>


            </div>



            <!-- IMAGE -->

            <div class="post-image-wrap">


                <img

                    class="post-image"

                    src="${escapeHtml(
                        image.public_url
                    )}"

                    alt="Shared image"

                    loading="lazy"

                    onerror="
                        this.style.display='none';
                    "

                >


            </div>



            <!-- REACTION SUMMARY -->

            <div class="reaction-summary">


                👍 ${likeCount}


                &nbsp;&nbsp;


                ❤️ ${loveCount}


                &nbsp;&nbsp;


                😮 ${wowCount}


            </div>



            <!-- REACTION BUTTONS -->

            <div class="reaction-buttons">


                <button

                    class="reaction-btn ${
                        myReaction === "like"
                            ? "active"
                            : ""
                    }"

                    onclick="reactToImage(
                        ${image.id},
                        'like',
                        this
                    )"

                >

                    👍 Like

                </button>



                <button

                    class="reaction-btn ${
                        myReaction === "love"
                            ? "love-active"
                            : ""
                    }"

                    onclick="reactToImage(
                        ${image.id},
                        'love',
                        this
                    )"

                >

                    ❤️ Love

                </button>



                <button

                    class="reaction-btn ${
                        myReaction === "wow"
                            ? "active"
                            : ""
                    }"

                    onclick="reactToImage(
                        ${image.id},
                        'wow',
                        this
                    )"

                >

                    😮 Wow

                </button>


            </div>


        </article>

    `;

}



/* =========================================================
   REACTION SYSTEM
========================================================= */

async function reactToImage(

    imageId,

    reactionType,

    button

) {


    if (!currentUser) {

        showToast(
            "Please login to react."
        );

        return;

    }


    button.disabled = true;


    try {


        const {
            data: existing,
            error: findError
        } =
            await supabaseClient

                .from(REACTIONS_TABLE)

                .select(
                    "id,reaction"
                )

                .eq(
                    "image_id",
                    imageId
                )

                .eq(
                    "user_id",
                    currentUser.id
                )

                .maybeSingle();


        if (findError) {

            throw findError;

        }



        /* REMOVE SAME REACTION */

        if (

            existing &&

            existing.reaction ===
            reactionType

        ) {


            const {
                error
            } =
                await supabaseClient

                    .from(
                        REACTIONS_TABLE
                    )

                    .delete()

                    .eq(
                        "id",
                        existing.id
                    )

                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (error) {

                throw error;

            }

        }



        /* CHANGE REACTION */

        else if (existing) {


            const {
                error
            } =
                await supabaseClient

                    .from(
                        REACTIONS_TABLE
                    )

                    .update({

                        reaction:
                            reactionType

                    })

                    .eq(
                        "id",
                        existing.id
                    )

                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (error) {

                throw error;

            }

        }



        /* NEW REACTION */

        else {


            const {
                error
            } =
                await supabaseClient

                    .from(
                        REACTIONS_TABLE
                    )

                    .insert({

                        image_id:
                            imageId,

                        user_id:
                            currentUser.id,

                        reaction:
                            reactionType

                    });


            if (error) {

                throw error;

            }

        }



        /* REFRESH */

        resetFeed();

        await loadImages(true);


    } catch (error) {


        console.error(
            "Reaction error:",
            error
        );


        showToast(
            "Reaction failed: " +
            error.message
        );


    } finally {

        button.disabled =
            false;

    }

}



/* =========================================================
   LOAD MORE
========================================================= */

async function loadMoreImages() {

    await loadImages(false);

}



/* =========================================================
   INIT
========================================================= */

loadTheme();


(async function init() {


    await loadAuth();


    await loadImages(true);


})();
