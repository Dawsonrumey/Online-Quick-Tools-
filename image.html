<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Hub - Online Quick Tools</title>

  <meta name="description"
        content="Upload, view and react to images on Online Quick Tools.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      color: #e63946;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button,
    .home-btn {
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .home-btn {
      background: #222;
      color: #fff;
      text-decoration: none;
    }

    .login-btn {
      background: #e63946;
      color: white;
    }

    .logout-btn {
      background: #555;
      color: white;
      display: none;
    }

    main {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto 50px;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .hero p {
      color: #666;
      font-size: 15px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    .panel h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    #uploadPanel {
      display: none;
    }

    .user-info {
      background: #f0f3f8;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      word-break: break-all;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px dashed #aaa;
      border-radius: 9px;
      background: #fafafa;
      margin-bottom: 12px;
    }

    .upload-btn {
      width: 100%;
      background: #e63946;
      color: white;
      padding: 12px;
    }

    .upload-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e8f7ed;
      color: #16743a;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #a11;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .image-card {
      background: #fff;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .image-card img {
      width: 100%;
      height: 230px;
      display: block;
      object-fit: cover;
      background: #eee;
    }

    .image-content {
      padding: 12px;
    }

    .image-date {
      color: #777;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .reactions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .reaction-btn {
      flex: 1;
      min-width: 65px;
      background: #f1f3f6;
      color: #222;
      border: 1px solid #ddd;
      transition: .2s;
    }

    .reaction-btn:hover {
      transform: translateY(-1px);
    }

    .reaction-btn.active {
      background: #ffe8e8;
      border-color: #e63946;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #777;
      background: white;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    .login-required {
      text-align: center;
      padding: 18px;
      background: #fff7df;
      border-radius: 10px;
      color: #765b00;
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #777;
      font-size: 13px;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    /* Dark mode */
    body.dark {
      background: #111827;
      color: #eee;
    }

    body.dark header,
    body.dark .panel,
    body.dark .image-card,
    body.dark footer,
    body.dark .empty {
      background: #1f2937;
      color: #eee;
    }

    body.dark header,
    body.dark footer {
      border-color: #374151;
    }

    body.dark .hero p,
    body.dark .image-date {
      color: #aaa;
    }

    body.dark .user-info,
    body.dark input[type="file"] {
      background: #111827;
      color: #eee;
      border-color: #444;
    }

    body.dark .reaction-btn {
      background: #374151;
      color: #eee;
      border-color: #4b5563;
    }

    body.dark .reaction-btn.active {
      background: #4b2525;
      border-color: #e63946;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-wrap: wrap;
      }

      .logo {
        font-size: 18px;
      }

      .hero h1 {
        font-size: 25px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .image-card img {
        height: 180px;
      }

      .image-content {
        padding: 8px;
      }

      .reaction-btn {
        min-width: 0;
        padding: 8px 4px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .image-card img {
        height: 240px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      🖼️ Image Hub
    </div>

    <div class="header-buttons">
      <a href="index.html" class="home-btn">🏠 Home</a>
      <button id="loginBtn" class="login-btn">🔐 Login</button>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

  </div>
</header>


<main>

  <section class="hero">
    <h1>🖼️ Image Hub</h1>
    <p>Share images and react to your favorite ones.</p>
  </section>


  <!-- Login notice -->
  <div id="loginNotice" class="login-required">
    🔐 Please login to upload images and react.
  </div>


  <!-- Upload -->
  <section id="uploadPanel" class="panel">

    <h2>📤 Upload Image</h2>

    <div id="userInfo" class="user-info"></div>

    <input
      type="file"
      id="imageFile"
      accept="image/jpeg,image/png,image/webp"
    >

    <button
      id="uploadBtn"
      class="upload-btn"
    >
      ⬆️ Upload Image
    </button>

    <div id="uploadMessage" class="message"></div>

  </section>


  <!-- Gallery -->
  <section class="panel">

    <h2>🖼️ Image Gallery</h2>

    <div id="gallery" class="gallery">
      <div class="loading">
        Loading images...
      </div>
    </div>

  </section>

</main>


<footer>
  © 2026 Online Quick Tools — Image Hub
</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =====================================================
     SUPABASE CONFIG
     ===================================================== */

  const SUPABASE_URL = "https://etkqkptoxkfhxcysaadi.supabase.co"
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0a3FrcHRveGtmaHhjeXNhYWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTAzMjIsImV4cCI6MjEwMzY2NjMyMn0.HXBJkxIvbELW4XmJB4bsve5u_XpD21B8XNX5ODIsufA";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =====================================================
     SETTINGS
     ===================================================== */

  const BUCKET_NAME = "images";
  const IMAGES_TABLE = "images";
  const REACTIONS_TABLE = "image_reactions";


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginNotice = document.getElementById("loginNotice");
  const uploadPanel = document.getElementById("uploadPanel");
  const userInfo = document.getElementById("userInfo");
  const uploadBtn = document.getElementById("uploadBtn");
  const imageFile = document.getElementById("imageFile");
  const uploadMessage = document.getElementById("uploadMessage");
  const gallery = document.getElementById("gallery");


  /* =====================================================
     LOGIN
     ===================================================== */

  loginBtn.addEventListener("click", async () => {

    const email = prompt("Enter your email:");

    if (!email) return;

    const password = prompt("Enter your password:");

    if (!password) return;

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    await updateAuthUI();

  });


  /* =====================================================
     LOGOUT
     ===================================================== */

  logoutBtn.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    await updateAuthUI();

  });


  /* =====================================================
     AUTH UI
     ===================================================== */

  async function updateAuthUI() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {

      loginBtn.style.display = "none";
      logoutBtn.style.display = "block";

      loginNotice.style.display = "none";
      uploadPanel.style.display = "block";

      userInfo.textContent =
        "Logged in as: " + user.email;

    } else {

      loginBtn.style.display = "block";
      logoutBtn.style.display = "none";

      loginNotice.style.display = "block";
      uploadPanel.style.display = "none";

    }

    await loadGallery();

  }


  /* =====================================================
     UPLOAD IMAGE
     ===================================================== */

  uploadBtn.addEventListener("click", async () => {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      alert("Please login first.");
      return;
    }

    const file = imageFile.files[0];

    if (!file) {
      showUploadMessage(
        "Please select an image first.",
        "error"
      );
      return;
    }


    /* File validation */

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

      showUploadMessage(
        "Only JPG, PNG or WebP images are allowed.",
        "error"
      );

      return;
    }


    /* 5 MB limit */

    const MAX_SIZE = 5 * 1024 * 1024;

    if (file.size > MAX_SIZE) {

      showUploadMessage(
        "Maximum image size is 5 MB.",
        "error"
      );

      return;
    }


    uploadBtn.disabled = true;
    uploadBtn.textContent = "Uploading...";

    showUploadMessage(
      "Uploading image...",
      "success"
    );


    try {

      /*
        User-specific folder:

        user_id/random-file-name.ext

        This is also compatible with
        Storage RLS folder policies.
      */

      const extension =
        file.name.split(".").pop().toLowerCase();

      const fileName =
        crypto.randomUUID() + "." + extension;

      const filePath =
        user.id + "/" + fileName;


      /* Upload to Storage */

      const {
        error: storageError
      } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });


      if (storageError) {
        throw new Error(
          "Storage upload failed: " +
          storageError.message
        );
      }


      /* Public URL */

      const {
        data: publicData
      } = supabaseClient.storage
        .from(BUCKET_NAME)
        .getPublicUrl(filePath);

      const publicUrl =
        publicData.publicUrl;


      /* Insert image record */

      const {
        error: dbError
      } = await supabaseClient
        .from(IMAGES_TABLE)
        .insert({
          user_id: user.id,
          file_path: filePath,
          public_url: publicUrl
        });


      if (dbError) {

        /*
          If database insert fails after
          storage upload, try removing
          the uploaded file.
        */

        await supabaseClient.storage
          .from(BUCKET_NAME)
          .remove([filePath]);

        throw new Error(
          "Database insert failed: " +
          dbError.message
        );
      }


      imageFile.value = "";

      showUploadMessage(
        "✅ Image uploaded successfully!",
        "success"
      );

      await loadGallery();


    } catch (error) {

      console.error(error);

      showUploadMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {

      uploadBtn.disabled = false;
      uploadBtn.textContent = "⬆️ Upload Image";

    }

  });


  /* =====================================================
     UPLOAD MESSAGE
     ===================================================== */

  function showUploadMessage(message, type) {

    uploadMessage.textContent = message;

    uploadMessage.className =
      "message " + type;

  }


  /* =====================================================
     LOAD GALLERY
     ===================================================== */

  async function loadGallery() {

    gallery.innerHTML =
      '<div class="loading">Loading images...</div>';


    const {
      data: images,
      error
    } = await supabaseClient
      .from(IMAGES_TABLE)
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      gallery.innerHTML = `
        <div class="empty">
          ❌ Failed to load images.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    if (!images || images.length === 0) {

      gallery.innerHTML = `
        <div class="empty">
          🖼️ No images uploaded yet.
        </div>
      `;

      return;
    }


    /* Get current user */

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    /*
      Load all reactions once.
      This is more efficient than making
      a separate request for every image.
    */

    const {
      data: reactions,
      error: reactionError
    } = await supabaseClient
      .from(REACTIONS_TABLE)
      .select("image_id,user_id,reaction");


    if (reactionError) {

      console.warn(
        "Reaction loading error:",
        reactionError.message
      );

    }


    const reactionList =
      reactions || [];


    gallery.innerHTML = "";


    images.forEach(image => {

      const imageReactions =
        reactionList.filter(
          r => String(r.image_id) === String(image.id)
        );


      const likeCount =
        imageReactions.filter(
          r => r.reaction === "like"
        ).length;

      const loveCount =
        imageReactions.filter(
          r => r.reaction === "love"
        ).length;

      const wowCount =
        imageReactions.filter(
          r => r.reaction === "wow"
        ).length;


      let userReaction = null;

      if (user) {

        const myReaction =
          imageReactions.find(
            r => r.user_id === user.id
          );

        if (myReaction) {
          userReaction = myReaction.reaction;
        }

      }


      const card =
        document.createElement("div");

      card.className = "image-card";


      card.innerHTML = `

        <img
          src="${escapeAttribute(image.public_url)}"
          alt="Uploaded image"
          loading="lazy"
          onerror="this.style.display='none';"
        >

        <div class="image-content">

          <div class="image-date">
            ${formatDate(image.created_at)}
          </div>

          <div class="reactions">

            <button
              class="reaction-btn ${userReaction === "like" ? "active" : ""}"
              data-image="${image.id}"
              data-reaction="like"
            >
              👍 ${likeCount}
            </button>

            <button
              class="reaction-btn ${userReaction === "love" ? "active" : ""}"
              data-image="${image.id}"
              data-reaction="love"
            >
              ❤️ ${loveCount}
            </button>

            <button
              class="reaction-btn ${userReaction === "wow" ? "active" : ""}"
              data-image="${image.id}"
              data-reaction="wow"
            >
              😮 ${wowCount}
            </button>

          </div>

        </div>
      `;


      card.querySelectorAll(
        ".reaction-btn"
      ).forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            await handleReaction(
              image.id,
              button.dataset.reaction
            );

          }
        );

      });


      gallery.appendChild(card);

    });

  }


  /* =====================================================
     REACTION HANDLER
     ===================================================== */

  async function handleReaction(
    imageId,
    reaction
  ) {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

      alert(
        "Please login to react to an image."
      );

      return;
    }


    /*
      Find existing reaction
    */

    const {
      data: existing,
      error: findError
    } = await supabaseClient
      .from(REACTIONS_TABLE)
      .select("id,reaction")
      .eq("image_id", imageId)
      .eq("user_id", user.id)
      .maybeSingle();


    if (findError) {

      alert(
        "Reaction check failed: " +
        findError.message
      );

      return;
    }


    /*
      Same reaction = REMOVE
    */

    if (
      existing &&
      existing.reaction === reaction
    ) {

      const {
        error
      } = await supabaseClient
        .from(REACTIONS_TABLE)
        .delete()
        .eq("id", existing.id);

      if (error) {

        alert(
          "Could not remove reaction: " +
          error.message
        );

        return;
      }

    }

    /*
      Different reaction =
      UPDATE existing row
    */

    else if (existing) {

      const {
        error
      } = await supabaseClient
        .from(REACTIONS_TABLE)
        .update({
          reaction: reaction
        })
        .eq("id", existing.id);

      if (error) {

        alert(
          "Could not change reaction: " +
          error.message
        );

        return;
      }

    }

    /*
      No existing reaction =
      INSERT new row
    */

    else {

      const {
        error
      } = await supabaseClient
        .from(REACTIONS_TABLE)
        .insert({
          image_id: imageId,
          user_id: user.id,
          reaction: reaction
        });


      if (error) {

        alert(
          "Could not add reaction: " +
          error.message
        );

        return;
      }

    }


    /*
      Reload gallery so counts
      immediately update.
    */

    await loadGallery();

  }


  /* =====================================================
     DATE FORMAT
     ===================================================== */

  function formatDate(dateString) {

    if (!dateString) return "";

    try {

      return new Date(dateString)
        .toLocaleString();

    } catch {

      return "";

    }

  }


  /* =====================================================
     HTML ESCAPE
     ===================================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  /* =====================================================
     AUTH STATE LISTENER
     ===================================================== */

  supabaseClient.auth.onAuthStateChange(
    async () => {

      await updateAuthUI();

    }
  );


  /* =====================================================
     DARK MODE
     ===================================================== */

  /*
    If your index.html already saves the theme
    using localStorage, this page will follow it.
  */

  function applyTheme() {

    const theme =
      localStorage.getItem("theme");

    const darkMode =
      localStorage.getItem("darkMode");

    if (
      theme === "dark" ||
      darkMode === "true"
    ) {

      document.body.classList.add("dark");

    }

  }

  applyTheme();


  /* =====================================================
     INITIAL LOAD
     ===================================================== */

  updateAuthUI();

</script>

</body>
</html>
