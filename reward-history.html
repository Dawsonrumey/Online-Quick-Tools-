<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rewards History - Online Quick Tools</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
}

body.dark{
    background:#111827;
    color:#f3f4f6;
}

header{
    background:#4f46e5;
    color:white;
    text-align:center;
    padding:18px 12px;
}

header h1{
    margin:0 0 12px;
}

.nav{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.nav a,
.nav button{
    border:0;
    background:white;
    color:#4f46e5;
    padding:9px 13px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.dark .card{
    background:#1f2937;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:#eef2ff;
    padding:16px 8px;
    border-radius:12px;
    text-align:center;
}

.dark .stat{
    background:#374151;
}

.stat strong{
    display:block;
    font-size:26px;
    color:#4f46e5;
}

.dark .stat strong{
    color:#a5b4fc;
}

.transaction{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #ddd;
}

.dark .transaction{
    border-color:#374151;
}

.icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef2ff;
    border-radius:50%;
    font-size:22px;
    flex-shrink:0;
}

.transaction-info{
    flex:1;
}

.transaction-info strong{
    display:block;
    margin-bottom:4px;
}

.transaction-info small{
    color:#6b7280;
}

.amount{
    color:#16a34a;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
    word-break:break-word;
}

.debug{
    background:#111827;
    color:#d1fae5;
    border-radius:12px;
    padding:15px;
    font-family:monospace;
    font-size:13px;
    line-height:1.6;
    overflow-wrap:anywhere;
}

.debug-title{
    color:#facc15;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.referral{
    border:1px solid #ddd;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
}

.dark .referral{
    border-color:#374151;
}

.login-box{
    text-align:center;
}

.login-box a{
    display:inline-block;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border-radius:8px;
}

footer{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .transaction{
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<header>

<h1>🎁 Rewards History</h1>

<div class="nav">

<a href="profile.html">👤 Profile</a>

<a href="index.html">🏠 Home</a>

<button onclick="toggleDarkMode()">🌙 Dark Mode</button>

</div>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox" class="card login-box" style="display:none;">

<h2>🔐 Login Required</h2>

<p>Please login to view your rewards history.</p>

<a href="login.html">Login</a>

</div>


<!-- MAIN -->

<div id="mainContent" style="display:none;">


<!-- DEBUG -->

<div class="card">

<div class="debug">

<div class="debug-title">
🔧 Rewards Debug Information
</div>

<div id="debugInfo">
Starting...
</div>

</div>

</div>


<!-- STATS -->

<div class="card">

<div class="stats">

<div class="stat">

<strong id="totalReferrals">0</strong>

<span>Total Referrals</span>

</div>


<div class="stat">

<strong id="referralPoints">0</strong>

<span>Referral Points</span>

</div>


<div class="stat">

<strong id="currentPoints">0</strong>

<span>Current Points</span>

</div>

</div>

</div>


<!-- TRANSACTIONS -->

<div class="card">

<h2>💰 Points & Reward History</h2>

<div id="transactions">

Loading...

</div>

</div>


<!-- REFERRALS -->

<div class="card">

<h2>👥 Referral History</h2>

<div id="history">

Loading...

</div>

</div>


</div>

</div>


<footer>
© 2026 Online Quick Tools
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
EXPECTED DATABASE USER
========================= */

const EXPECTED_USER_ID =
"3da82c0d-d0fd-4530-a6e7-9ec366de5aa7";


/* =========================
ELEMENTS
========================= */

const debugInfo =
document.getElementById("debugInfo");

const loginBox =
document.getElementById("loginBox");

const mainContent =
document.getElementById("mainContent");

const transactions =
document.getElementById("transactions");

const history =
document.getElementById("history");


/* =========================
DEBUG
========================= */

function debug(text){

    debugInfo.innerHTML +=
        "<div>" + escapeHtml(text) + "</div>";

}


/* =========================
ESCAPE
========================= */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
DARK MODE
========================= */

function toggleDarkMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
        ? "on"
        : "off"
    );

}


if(localStorage.getItem("darkMode")==="on"){

    document.body.classList.add("dark");

}


/* =========================
DATE
========================= */

function formatDate(date){

    const d = new Date(date);

    if(isNaN(d.getTime())){

        return String(date);

    }

    return d.toLocaleString("en-BD",{

        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"

    });

}


/* =========================
ICON
========================= */

function getIcon(type){

    type =
        String(type || "").toLowerCase();

    if(type.includes("daily"))
        return "🎁";

    if(type.includes("login"))
        return "🎁";

    if(type.includes("task"))
        return "✅";

    if(type.includes("referral"))
        return "👥";

    return "⭐";

}


/* =========================
PROFILE
========================= */

async function loadProfile(userId){

    debug(
        "Loading profiles for user: " +
        userId
    );

    const result =
        await supabaseClient
        .from("profiles")
        .select(
            "id,username,points,referral_count"
        )
        .eq("id",userId)
        .single();

    if(result.error){

        debug(
            "PROFILE ERROR: " +
            result.error.message
        );

        throw result.error;

    }

    debug(
        "Profile found: " +
        result.data.username
    );

    debug(
        "Profile points: " +
        result.data.points
    );

    document.getElementById(
        "currentPoints"
    ).textContent =
        result.data.points ?? 0;

    document.getElementById(
        "totalReferrals"
    ).textContent =
        result.data.referral_count ?? 0;

    document.getElementById(
        "referralPoints"
    ).textContent =
        (result.data.referral_count ?? 0) * 10;

}


/* =========================
TRANSACTIONS
========================= */

async function loadTransactions(userId){

    debug(
        "Querying reward_transactions..."
    );

    debug(
        "Query user_id = " +
        userId
    );

    const result =
        await supabaseClient
        .from("reward_transactions")
        .select(
            "id,user_id,amount,type,description,created_at"
        )
        .eq("user_id",userId)
        .order(
            "created_at",
            {ascending:false}
        );

    if(result.error){

        debug(
            "TRANSACTION ERROR: " +
            result.error.message
        );

        transactions.innerHTML =
            `<div class="error">
            ❌ ${escapeHtml(result.error.message)}
            </div>`;

        return;

    }

    debug(
        "Transaction rows returned: " +
        (result.data?.length || 0)
    );


    if(result.data){

        result.data.forEach(row => {

            debug(
                "Transaction #" +
                row.id +
                " | +" +
                row.amount +
                " | " +
                row.type
            );

        });

    }


    if(!result.data ||
       result.data.length === 0){

        transactions.innerHTML =
            `<div class="empty">
            🎁 No reward transactions found.
            </div>`;

        return;

    }


    transactions.innerHTML = "";


    result.data.forEach(row => {

        const div =
            document.createElement("div");

        div.className =
            "transaction";

        div.innerHTML = `

        <div class="icon">
            ${getIcon(row.type)}
        </div>

        <div class="transaction-info">

            <strong>
                ${escapeHtml(
                    row.description ||
                    row.type ||
                    "Reward"
                )}
            </strong>

            <small>
                ${formatDate(row.created_at)}
            </small>

        </div>

        <div class="amount">
            +${Number(row.amount || 0)}
        </div>

        `;

        transactions.appendChild(div);

    });

}


/* =========================
REFERRALS
========================= */

async function loadReferrals(userId){

    debug(
        "Loading referrals..."
    );

    const result =
        await supabaseClient
        .from("referrals")
        .select(`
            id,
            referred_user_id,
            referral_code,
            reward_referrer,
            status,
            created_at
        `)
        .eq("referrer_id",userId)
        .order(
            "created_at",
            {ascending:false}
        );

    if(result.error){

        debug(
            "REFERRAL ERROR: " +
            result.error.message
        );

        history.innerHTML =
            `<div class="error">
            ❌ ${escapeHtml(result.error.message)}
            </div>`;

        return;

    }

    debug(
        "Referral rows returned: " +
        (result.data?.length || 0)
    );


    if(!result.data ||
       result.data.length === 0){

        history.innerHTML =
            `<div class="empty">
            👥 No referral history yet.
            </div>`;

        return;

    }


    history.innerHTML = "";


    result.data.forEach(row => {

        const div =
            document.createElement("div");

        div.className =
            "referral";

        div.innerHTML = `

        <strong>
            👤 Referred User
        </strong>

        <div>
            Status:
            <b>
                ${escapeHtml(
                    row.status || "pending"
                )}
            </b>
        </div>

        <div>
            Reward:
            <b>
                +${Number(
                    row.reward_referrer || 10
                )} points
            </b>
        </div>

        <small>
            ${formatDate(row.created_at)}
        </small>

        `;

        history.appendChild(div);

    });

}


/* =========================
MAIN LOAD
========================= */

async function loadPage(session){

    debug("Session found: YES");

    debug(
        "Logged-in user ID: " +
        session.user.id
    );

    debug(
        "Expected database user ID: " +
        EXPECTED_USER_ID
    );


    if(
        session.user.id === EXPECTED_USER_ID
    ){

        debug(
            "USER ID MATCH: YES ✅"
        );

    }else{

        debug(
            "USER ID MATCH: NO ❌"
        );

        debug(
            "This is likely the problem."
        );

    }


    loginBox.style.display =
        "none";

    mainContent.style.display =
        "block";


    try{

        await loadProfile(
            session.user.id
        );

    }catch(error){

        debug(
            "Profile loading failed."
        );

    }


    await loadTransactions(
        session.user.id
    );


    await loadReferrals(
        session.user.id
    );


    debug(
        "Page loading finished."
    );

}


/* =========================
INIT
========================= */

async function init(){

    debug(
        "Starting Rewards History V5..."
    );

    try{

        const result =
            await supabaseClient.auth.getSession();

        if(result.error){

            debug(
                "SESSION ERROR: " +
                result.error.message
            );

            loginBox.style.display =
                "block";

            return;

        }


        const session =
            result.data.session;


        if(!session){

            debug(
                "Session found: NO ❌"
            );

            loginBox.style.display =
                "block";

            return;

        }


        await loadPage(session);

    }
    catch(error){

        debug(
            "FATAL ERROR: " +
            error.message
        );

    }

}


/* =========================
AUTH CHANGE
========================= */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(session){

            loadPage(session);

        }else{

            loginBox.style.display =
                "block";

            mainContent.style.display =
                "none";

        }

    }
);


/* START */

init();

</script>

</body>
</html>
