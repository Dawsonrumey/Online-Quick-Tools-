<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Feed - Online Quick Tools</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.header{
    background:#4f46e5;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px #0001;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    border:0;
    border-radius:10px;
    overflow:hidden;
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.tiktok-player{
    width:100%;
    height:650px;
    border:0;
    border-radius:10px;
}

.facebook-player{
    width:100%;
    min-height:400px;
    border:0;
}

h2{
    margin:10px 0;
}

.platform{
    font-size:13px;
    color:#666;
    margin-bottom:5px;
}

.watch{
    display:inline-block;
    margin-top:10px;
    padding:10px 15px;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.empty{
    text-align:center;
    padding:40px 10px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎬 Video Share</h1>
    <p>Videos shared by our community</p>
</div>

<div class="container" id="feed">
    <div class="card empty">Loading videos...</div>
</div>

<script>

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


async function loadVideos(){

    const feed = document.getElementById("feed");

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/Videos?select=id,title,platform,videos_url,status&status=eq.approved&order=created_at.desc",
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer " + SUPABASE_KEY
                }
            }
        );

        if(!response.ok){
            throw new Error(await response.text());
        }

        const videos = await response.json();

        if(videos.length === 0){

            feed.innerHTML =
            '<div class="card empty">🎬 No approved videos yet.</div>';

            return;
        }

        feed.innerHTML = "";

        videos.forEach(video => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <div class="platform">
                    ${escapeHTML(video.platform)}
                </div>

                <h2>
                    ${escapeHTML(video.title)}
                </h2>

                ${createPlayer(
                    video.platform,
                    video.videos_url
                )}
            `;

            feed.appendChild(card);

        });

    }catch(error){

        console.error(error);

        feed.innerHTML =
        '<div class="card empty">❌ Could not load videos.</div>';
    }
}


/* =========================
   VIDEO PLAYER
========================= */

function createPlayer(platform,url){

    if(!url){
        return "";
    }

    if(platform === "YouTube"){

        const id = getYouTubeID(url);

        if(id){

            return `
            <div class="player">
                <iframe
                    src="https://www.youtube.com/embed/${encodeURIComponent(id)}"
                    title="YouTube video"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>`;
        }
    }


    if(platform === "TikTok"){

        const id = getTikTokID(url);

        if(id){

            return `
            <iframe
                class="tiktok-player"
                src="https://www.tiktok.com/player/v1/${encodeURIComponent(id)}?controls=1&description=1"
                title="TikTok video"
                allow="fullscreen">
            </iframe>`;
        }
    }


    if(platform === "Facebook"){

        return `
        <div class="player">
            <iframe
                class="facebook-player"
                src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=500"
                scrolling="no"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>`;
    }


    return `
        <a
            class="watch"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer">
            ▶️ Watch Original Video
        </a>
    `;
}


/* =========================
   YOUTUBE ID
========================= */

function getYouTubeID(url){

    try{

        const u = new URL(url);

        if(u.hostname.includes("youtu.be")){

            return u.pathname.substring(1).split("/")[0];
        }

        if(u.hostname.includes("youtube.com")){

            return u.searchParams.get("v");
        }

    }catch(e){}

    return null;
}


/* =========================
   TIKTOK ID
========================= */

function getTikTokID(url){

    try{

        const match =
        url.match(/\/video\/(\d+)/);

        if(match){

            return match[1];
        }

    }catch(e){}

    return null;
}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


loadVideos();

</script>

</body>
</html>
