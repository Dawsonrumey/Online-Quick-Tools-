<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Submit Video - Online Quick Tools</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:15px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-top:0;
}

.subtitle{
    text-align:center;
    color:#666;
    line-height:1.5;
}

label{
    display:block;
    font-weight:bold;
    margin:18px 0 7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

input[type="file"]{
    padding:10px;
    background:#fafafa;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:9px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    background:#999;
}

#preview{
    display:none;
    width:100%;
    max-height:350px;
    margin-top:15px;
    border-radius:10px;
    background:#000;
}

#fileInfo{
    margin-top:10px;
    color:#666;
    font-size:14px;
}

#msg{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.5;
}

.success{
    color:green;
}

.error{
    color:red;
}

.note{
    margin-top:20px;
    padding:12px;
    background:#f1f5ff;
    border-radius:9px;
    font-size:13px;
    color:#555;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🎬 Submit Your Video</h1>

<p class="subtitle">
Upload your video to Online Quick Tools.
</p>

<form id="videoForm">

<label>Video Title</label>

<input
    id="title"
    type="text"
    maxlength="150"
    placeholder="Enter video title"
    required
>


<label>Description</label>

<textarea
    id="description"
    rows="4"
    maxlength="1000"
    placeholder="Write a short description"
></textarea>


<label>Select Video</label>

<input
    id="videoFile"
    type="file"
    accept="video/*"
    required
>

<div id="fileInfo"></div>

<video
    id="preview"
    controls
></video>


<button
    id="submitBtn"
    type="submit"
>
⬆️ Upload & Submit Video
</button>

</form>

<div id="msg"></div>

<div class="note">
<b>Upload information:</b><br>
• MP4 is recommended<br>
• Maximum size: 100 MB<br>
• Video will be submitted as <b>pending</b><br>
• Admin approval is required before it appears publicly
</div>

</div>

</div>


<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


/* Supabase client */

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* Elements */

const form =
document.getElementById("videoForm");

const titleInput =
document.getElementById("title");

const descriptionInput =
document.getElementById("description");

const videoInput =
document.getElementById("videoFile");

const preview =
document.getElementById("preview");

const fileInfo =
document.getElementById("fileInfo");

const msg =
document.getElementById("msg");

const submitBtn =
document.getElementById("submitBtn");


/* Preview */

videoInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        preview.style.display="none";
        fileInfo.textContent="";
        return;
    }

    const sizeMB =
    file.size / 1024 / 1024;

    fileInfo.textContent =
    "Selected: " +
    file.name +
    " — " +
    sizeMB.toFixed(2) +
    " MB";


    if(!file.type.startsWith("video/")){

        msg.className="error";
        msg.textContent=
        "❌ Please select a video file.";

        preview.style.display="none";

        return;
    }


    if(file.size > 100 * 1024 * 1024){

        msg.className="error";
        msg.textContent=
        "❌ Maximum file size is 100 MB.";

        preview.style.display="none";

        return;
    }


    msg.textContent="";


    const objectURL =
    URL.createObjectURL(file);

    preview.src=objectURL;

    preview.style.display="block";

});


/* Submit */

form.addEventListener("submit", async function(e){

    e.preventDefault();

    msg.className="";
    msg.textContent="";

    const title =
    titleInput.value.trim();

    const description =
    descriptionInput.value.trim();

    const file =
    videoInput.files[0];


    if(!title){

        msg.className="error";
        msg.textContent=
        "❌ Enter a video title.";

        return;
    }


    if(!file){

        msg.className="error";
        msg.textContent=
        "❌ Select a video.";

        return;
    }


    if(!file.type.startsWith("video/")){

        msg.className="error";
        msg.textContent=
        "❌ The selected file is not a video.";

        return;
    }


    if(file.size > 100 * 1024 * 1024){

        msg.className="error";
        msg.textContent=
        "❌ Video must be 100 MB or smaller.";

        return;
    }


    try{

        submitBtn.disabled=true;

        submitBtn.textContent=
        "⏳ Uploading...";

        msg.textContent=
        "Uploading video...";


        /* Unique file name */

        const extension =
        file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "mp4";


        const safeExtension =
        extension.replace(/[^a-z0-9]/g,"");


        const fileName =
        "video_" +
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,10) +
        "." +
        safeExtension;


        const filePath =
        "uploads/" + fileName;


        /* Upload */

        const upload =
        await client
        .storage
        .from("videos")
        .upload(
            filePath,
            file,
            {
                cacheControl:"3600",
                contentType:file.type,
                upsert:false
            }
        );


        if(upload.error){

            throw new Error(
                "Storage: " +
                upload.error.message
            );
        }


        /* Public URL */

        const publicURL =
        client
        .storage
        .from("videos")
        .getPublicUrl(filePath)
        .data
        .publicUrl;


        if(!publicURL){

            throw new Error(
                "Could not create public URL."
            );
        }


        msg.textContent=
        "✅ Video uploaded. Saving information...";


        /* Save to Videos table */

        const database =
        await client
        .from("Videos")
        .insert({

            title:title,

            platform:"Direct",

            videos_url:publicURL,

            status:"pending"

        });


        if(database.error){

            throw new Error(
                "Database: " +
                database.error.message
            );
        }


        /* Success */

        msg.className="success";

        msg.textContent=
        "✅ Video submitted successfully! " +
        "Waiting for approval.";


        form.reset();

        preview.pause();

        preview.removeAttribute("src");

        preview.load();

        preview.style.display="none";

        fileInfo.textContent="";


    }catch(error){

        console.error(
            "VIDEO SUBMIT ERROR:",
            error
        );

        msg.className="error";

        msg.textContent=
        "❌ Upload failed: " +
        error.message;


    }finally{

        submitBtn.disabled=false;

        submitBtn.textContent=
        "⬆️ Upload & Submit Video";

    }

});

</script>

</body>
</html>
