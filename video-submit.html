<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="description"
content="Upload your video to Online Quick Tools">

<title>Upload Video - Online Quick Tools</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7ff;
color:#172033;
padding:20px;
}

.container{
width:100%;
max-width:600px;
margin:25px auto;
}

.card{
background:#fff;
border-radius:20px;
padding:25px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:24px;
font-weight:800;
margin-bottom:8px;
}

.subtitle{
text-align:center;
font-size:14px;
color:#667085;
margin-bottom:25px;
line-height:1.5;
}

label{
display:block;
font-size:14px;
font-weight:700;
margin:14px 0 7px;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #dfe3ec;
border-radius:12px;
background:#fafbff;
color:#172033;
font-size:15px;
font-family:inherit;
outline:none;
}

input:focus,
textarea:focus{
border-color:#4f46e5;
box-shadow:0 0 0 3px rgba(79,70,229,.1);
}

textarea{
min-height:100px;
resize:vertical;
}

.fileBox{
border:2px dashed #cbd2e1;
border-radius:15px;
padding:20px;
text-align:center;
background:#fafbff;
}

.fileBox input{
border:0;
padding:5px;
background:transparent;
}

.fileInfo{
font-size:12px;
color:#667085;
margin-top:8px;
line-height:1.5;
}

.preview{
display:none;
margin-top:15px;
border-radius:14px;
overflow:hidden;
background:#000;
}

.preview video{
display:block;
width:100%;
max-height:350px;
}

.uploadBtn{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:12px;
background:#4f46e5;
color:#fff;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.uploadBtn:disabled{
opacity:.6;
cursor:not-allowed;
}

.progress{
display:none;
margin-top:18px;
}

.progressText{
font-size:13px;
font-weight:700;
margin-bottom:7px;
text-align:center;
}

.progressBar{
width:100%;
height:10px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progressFill{
width:0%;
height:100%;
background:#4f46e5;
transition:width .2s ease;
}

.message{
margin-top:18px;
padding:12px;
border-radius:12px;
text-align:center;
font-size:14px;
font-weight:700;
line-height:1.5;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.info{
background:#eef2ff;
color:#3730a3;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#4f46e5;
text-decoration:none;
font-size:14px;
font-weight:700;
}

.note{
margin-top:18px;
padding:12px;
border-radius:12px;
background:#f8fafc;
color:#64748b;
font-size:12px;
line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🎬 Upload Your Video
</div>

<div class="subtitle">
Upload your own video directly to Online Quick Tools.
</div>


<form id="videoForm">


<label for="title">
Video Title
</label>

<input
id="title"
type="text"
placeholder="Enter video title"
maxlength="150"
required>


<label for="description">
Description
</label>

<textarea
id="description"
placeholder="Write a short description..."
maxlength="1000"></textarea>


<label>
Select Video
</label>

<div class="fileBox">

<input
id="videoFile"
type="file"
accept="video/*"
required>

<div class="fileInfo">
Maximum file size: 100 MB
</div>

</div>


<div
id="preview"
class="preview">

<video
id="previewVideo"
controls
playsinline>
</video>

</div>


<button
id="uploadBtn"
class="uploadBtn"
type="submit">

📤 Upload Video

</button>


<div
id="progress"
class="progress">

<div
id="progressText"
class="progressText">

Uploading...

</div>

<div class="progressBar">

<div
id="progressFill"
class="progressFill">
</div>

</div>

</div>


<div
id="message"
style="display:none;">
</div>


</form>


<div class="note">

<strong>ℹ️ Note:</strong><br>

Your uploaded video will first be marked as
<strong>pending</strong>.

After approval, it can appear on the main
Video Hub.

</div>


<a
href="index.html"
class="back">

← Back to Online Quick Tools

</a>


</div>

</div>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


/* =====================================
   ELEMENTS
===================================== */

const form =
document.getElementById("videoForm");

const titleInput =
document.getElementById("title");

const descriptionInput =
document.getElementById("description");

const videoInput =
document.getElementById("videoFile");

const uploadBtn =
document.getElementById("uploadBtn");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");

const progressText =
document.getElementById("progressText");

const message =
document.getElementById("message");

const preview =
document.getElementById("preview");

const previewVideo =
document.getElementById("previewVideo");


/* =====================================
   MESSAGE
===================================== */

function showMessage(text,type){

message.style.display="block";

message.className="message "+type;

message.textContent=text;

}


/* =====================================
   VIDEO PREVIEW
===================================== */

videoInput.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file){

preview.style.display="none";

previewVideo.removeAttribute("src");

return;

}


/* Check video */

if(!file.type.startsWith("video/")){

showMessage(
"❌ Please select a valid video file.",
"error"
);

this.value="";

preview.style.display="none";

return;

}


/* Check size */

const maxSize =
100 * 1024 * 1024;

if(file.size > maxSize){

showMessage(
"❌ Video must be 100 MB or smaller.",
"error"
);

this.value="";

preview.style.display="none";

return;

}


/* Preview */

const objectURL =
URL.createObjectURL(file);

previewVideo.src =
objectURL;

preview.style.display =
"block";

message.style.display =
"none";

});


/* =====================================
   UPLOAD
===================================== */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const title =
titleInput.value.trim();

const description =
descriptionInput.value.trim();

const file =
videoInput.files[0];


if(!title){

showMessage(
"❌ Please enter a video title.",
"error"
);

return;

}


if(!file){

showMessage(
"❌ Please select a video.",
"error"
);

return;

}


/* File type */

if(!file.type.startsWith("video/")){

showMessage(
"❌ Please select a valid video file.",
"error"
);

return;

}


/* File size */

const maxSize =
100 * 1024 * 1024;

if(file.size > maxSize){

showMessage(
"❌ Video must be 100 MB or smaller.",
"error"
);

return;

}


/* Disable */

uploadBtn.disabled=true;

progress.style.display="block";

progressFill.style.width="10%";

progressText.textContent=
"Preparing upload...";

showMessage(
"⏳ Please wait...",
"info"
);


try{


/* =====================================
   CREATE UNIQUE FILE NAME
===================================== */

const extension =
file.name
.split(".")
.pop()
.toLowerCase()
.replace(/[^a-z0-9]/g,"");


const randomPart =
Math.random()
.toString(36)
.substring(2,10);


const fileName =
Date.now() +
"-" +
randomPart +
"." +
extension;


const filePath =
"uploads/" +
fileName;


progressFill.style.width="20%";

progressText.textContent=
"Uploading video...";


/* =====================================
   UPLOAD TO STORAGE
===================================== */

const uploadURL =
SUPABASE_URL +
"/storage/v1/object/videos/" +
filePath;


const uploadResponse =
await fetch(
uploadURL,
{
method:"POST",

headers:{
"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
file.type,

"x-upsert":
"false"
},

body:file
}
);


if(!uploadResponse.ok){

const errorText =
await uploadResponse.text();

throw new Error(
"Storage upload failed: " +
errorText
);

}


progressFill.style.width="70%";

progressText.textContent=
"Saving video information...";


/* =====================================
   PUBLIC VIDEO URL
===================================== */

const videoURL =
SUPABASE_URL +
"/storage/v1/object/public/videos/" +
filePath;


/* =====================================
   SAVE TO VIDEOS TABLE
===================================== */

const dbURL =
SUPABASE_URL +
"/rest/v1/Videos";


const dbResponse =
await fetch(
dbURL,
{
method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

title:title,

description:description,

platform:"Direct",

videos_url:videoURL,

status:"pending"

})
}
);


if(!dbResponse.ok){

const dbError =
await dbResponse.text();

throw new Error(
"Database error: " +
dbError
);

}


progressFill.style.width="100%";

progressText.textContent=
"Upload complete!";


showMessage(
"✅ Video uploaded successfully! It is now waiting for approval.",
"success"
);


/* Reset form */

form.reset();

preview.style.display="none";

previewVideo.removeAttribute("src");


}
catch(error){

console.error(
"VIDEO UPLOAD ERROR:",
error
);


progressFill.style.width="0%";

progressText.textContent=
"Upload failed";


showMessage(
"❌ Upload failed. " +
error.message,
"error"
);

}
finally{

uploadBtn.disabled=false;

}

});

</script>

</body>
</html>
