<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Submit Video - Online Quick Tools</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:15px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-top:0;
}

.subtitle{
    text-align:center;
    color:#666;
    line-height:1.5;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

input[type="file"]{
    padding:10px;
    background:#fafafa;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:9px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#preview{
    display:none;
    width:100%;
    max-height:350px;
    margin-top:15px;
    border-radius:10px;
    background:#000;
}

#fileInfo{
    margin-top:10px;
    color:#666;
    font-size:14px;
}

#msg{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.5;
}

.success{
    color:green;
}

.error{
    color:red;
}

.note{
    margin-top:20px;
    padding:12px;
    background:#f1f5ff;
    border-radius:9px;
    font-size:13px;
    color:#555;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🎬 Submit Your Video</h1>

<p class="subtitle">
Upload your own video and submit it to Online Quick Tools.
</p>

<form id="videoForm">

<label for="title">Video Title</label>

<input
    id="title"
    type="text"
    placeholder="Enter video title"
    maxlength="150"
    required
>


<label for="description">Description</label>

<textarea
    id="description"
    rows="4"
    maxlength="1000"
    placeholder="Write a short description"
></textarea>


<label for="videoFile">Select Video</label>

<input
    id="videoFile"
    type="file"
    accept="video/*"
    required
>

<div id="fileInfo"></div>

<video
    id="preview"
    controls
></video>


<button
    id="submitBtn"
    type="submit"
>
    ⬆️ Upload & Submit Video
</button>

</form>

<div id="msg"></div>

<div class="note">
<b>Important:</b><br>
• Maximum recommended file size: 100 MB<br>
• Use MP4 for best compatibility.<br>
• Your video will first be submitted as <b>pending</b>.<br>
• After approval, it can appear in the Video Hub.
</div>

</div>

</div>


<!-- Supabase JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


/* Create Supabase client */

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* Elements */

const form =
document.getElementById("videoForm");

const titleInput =
document.getElementById("title");

const descriptionInput =
document.getElementById("description");

const videoInput =
document.getElementById("videoFile");

const preview =
document.getElementById("preview");

const fileInfo =
document.getElementById("fileInfo");

const msg =
document.getElementById("msg");

const submitBtn =
document.getElementById("submitBtn");


/* Video preview */

videoInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){

        preview.style.display = "none";
        fileInfo.textContent = "";

        return;
    }


    const sizeMB =
    (file.size / 1024 / 1024).toFixed(2);


    fileInfo.textContent =
    "Selected: " +
    file.name +
    " (" +
    sizeMB +
    " MB)";


    if(!file.type.startsWith("video/")){

        msg.className = "error";

        msg.textContent =
        "❌ Please select a video file.";

        preview.style.display = "none";

        return;
    }


    if(file.size > 100 * 1024 * 1024){

        msg.className = "error";

        msg.textContent =
        "❌ Video is larger than 100 MB.";

        preview.style.display = "none";

        return;
    }


    msg.textContent = "";


    const videoURL =
    URL.createObjectURL(file);

    preview.src = videoURL;

    preview.style.display = "block";

});


/* Submit */

form.addEventListener("submit", async function(e){

    e.preventDefault();


    msg.className = "";
    msg.textContent = "";


    const title =
    titleInput.value.trim();

    const description =
    descriptionInput.value.trim();

    const file =
    videoInput.files[0];


    /* Validation */

    if(!title){

        msg.className = "error";
        msg.textContent =
        "❌ Please enter a video title.";

        return;
    }


    if(!file){

        msg.className = "error";
        msg.textContent =
        "❌ Please select a video.";

        return;
    }


    if(!file.type.startsWith("video/")){

        msg.className = "error";
        msg.textContent =
        "❌ Selected file is not a video.";

        return;
    }


    if(file.size > 100 * 1024 * 1024){

        msg.className = "error";
        msg.textContent =
        "❌ Maximum file size is 100 MB.";

        return;
    }


    try{

        submitBtn.disabled = true;

        submitBtn.textContent =
        "⏳ Uploading video...";


        msg.textContent =
        "Uploading video to Supabase...";


        /*
        Generate unique filename
        */

        const extension =
        file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "mp4";


        const uniqueName =
        "video_" +
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,10) +
        "." +
        extension;


        const filePath =
        "uploads/" + uniqueName;


        /*
        Upload to Supabase Storage
        */

        const uploadResult =
        await supabaseClient
        .storage
        .from("videos")
        .upload(
            filePath,
            file,
            {
                cacheControl:"3600",
                contentType:file.type,
                upsert:false
            }
        );


        if(uploadResult.error){

            throw new Error(
                "Storage: " +
                uploadResult.error.message
            );
        }


        /*
        Get public URL
        */

        const publicResult =
        supabaseClient
        .storage
        .from("videos")
        .getPublicUrl(filePath);


        const publicURL =
        publicResult.data.publicUrl;


        if(!publicURL){

            throw new Error(
                "Could not create public video URL."
            );
        }


        msg.textContent =
        "✅ Upload complete. Saving video...";


        /*
        Save video information
        */

        const dbResult =
        await supabaseClient
        .from("Videos")
        .insert({

            title:title,

            description:description,

            platform:"Direct",

            videos_url:publicURL,

            status:"pending"

        });


        if(dbResult.error){

            /*
            If database insert fails,
            show the actual error.
            */

            throw new Error(
                "Database: " +
                dbResult.error.message
            );
        }


        /*
        Success
        */

        msg.className =
        "success";

        msg.textContent =
        "✅ Video uploaded successfully! " +
        "Your video is now pending approval.";


        form.reset();

        preview.pause();

        preview.removeAttribute("src");

        preview.load();

        preview.style.display =
        "none";

        fileInfo.textContent = "";


    }catch(error){

        console.error(
            "VIDEO UPLOAD ERROR:",
            error
        );


        msg.className =
        "error";

        msg.textContent =
        "❌ Upload failed: " +
        error.message;


    }finally{

        submitBtn.disabled = false;

        submitBtn.textContent =
        "⬆️ Upload & Submit Video";

    }

});

</script>

</body>
</html>
