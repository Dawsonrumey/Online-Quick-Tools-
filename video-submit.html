<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Video - Online Quick Tools</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fb;color:#222}
.container{max-width:600px;margin:30px auto;padding:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0001}
h1{text-align:center}
input,textarea,select{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#4f46e5;color:white;font-size:16px}
#msg{text-align:center;margin-top:15px}
</style>
</head>
<body>

<div class="container">
<div class="card">

<h1>🎬 Submit Your Video</h1>
<p>Share your YouTube, Facebook or TikTok video with our community.</p>

<form id="videoForm">

<label>Platform</label>
<select id="platform" required>
<option value="">Select platform</option>
<option value="YouTube">YouTube</option>
<option value="Facebook">Facebook</option>
<option value="TikTok">TikTok</option>
</select>

<label>Video Title</label>
<input id="title" type="text" placeholder="Enter video title" required>

<label>Video URL</label>
<input id="video_url" type="url" placeholder="https://..." required>

<label>Description</label>
<textarea id="description" rows="4" placeholder="Write a short description"></textarea>

<button type="submit">Submit Video</button>

</form>

<div id="msg"></div>

</div>
</div>

<script>
const SUPABASE_URL="https://etkqkptoxkfhxcysaadi.supabase.co";
const SUPABASE_KEY="sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

document.getElementById("videoForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const msg = document.getElementById("msg");
    msg.textContent = "Submitting...";

    const data = {
        platform: document.getElementById("platform").value,
        title: document.getElementById("title").value.trim(),
        videos_url: document.getElementById("video_url").value.trim(),
        description: document.getElementById("description").value.trim(),
        status: "pending"
    };

    try {
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/Videos",
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify(data)
            }
        );

        if (!response.ok) {
            const error = await response.text();
            throw new Error(error);
        }

        msg.textContent = "✅ Video submitted successfully!";
        document.getElementById("videoForm").reset();

    } catch (error) {
    console.error(error);
    msg.textContent = "❌ Error: " + error.message;
    }
});
</script>
</body>
</html>
