<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Referral History - Online Quick Tools</title>

    <meta name="description"
          content="View your referral history and referral rewards on Online Quick Tools.">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MQS2RKPRF2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-MQS2RKPRF2');
    </script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .summary-box {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .summary-box strong {
            display: block;
            font-size: 25px;
            margin-top: 5px;
        }

        .history-item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
            background: #fff;
        }

        .history-item .title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .history-item div {
            margin: 5px 0;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: bold;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 25px 10px;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>👥 Referral History</h1>
    <a class="back" href="dashboard.html">← Back to Dashboard</a>
</header>

<main class="container">

    <div class="card">

        <h2>Referral Summary</h2>

        <div class="summary">
            <div class="summary-box">
                Referrals
                <strong id="referralCount">0</strong>
            </div>

            <div class="summary-box">
                Referral Rewards
                <strong id="rewardCount">0</strong>
            </div>
        </div>

    </div>

    <div class="card">

        <h2>History</h2>

        <div id="history">
            <div class="loading">
                Loading referral history...
            </div>
        </div>

    </div>

</main>

<script>
    const SUPABASE_URL =
        "https://etkqkptoxkfhxcysaadi.supabase.co";

    /*
      IMPORTANT:
      Keep your existing Supabase publishable/anon key here.
      Do not change it if your other pages already use it.
    */
    const SUPABASE_KEY = "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function loadReferralHistory() {

        const historyBox =
            document.getElementById("history");

        try {

            // Get logged-in user
            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {

                window.location.href = "login.html";
                return;
            }


            // Get referral records
            const {
                data: referrals,
                error: referralError
            } = await supabaseClient
                .from("referrals")
                .select(`
                    id,
                    referrer_id,
                    referred_user_id,
                    referral_code,
                    reward_referrer,
                    reward_referred,
                    status,
                    created_at
                `)
                .or(
                    `referrer_id.eq.${user.id},referred_user_id.eq.${user.id}`
                )
                .order("created_at", {
                    ascending: false
                });


            if (referralError) {
                throw referralError;
            }


            if (!referrals || referrals.length === 0) {

                document.getElementById("referralCount")
                    .textContent = "0";

                document.getElementById("rewardCount")
                    .textContent = "0";

                historyBox.innerHTML = `
                    <div class="empty">
                        No referral history yet.
                    </div>
                `;

                return;
            }


            let totalReferrals = 0;
            let totalRewards = 0;

            let html = "";


            referrals.forEach(referral => {

                const isReferrer =
                    referral.referrer_id === user.id;

                let role;
                let reward;

                if (isReferrer) {

                    role = "You referred a user";
                    reward = Number(
                        referral.reward_referrer || 0
                    );

                    totalReferrals++;

                } else {

                    role = "You joined through a referral";
                    reward = Number(
                        referral.reward_referred || 0
                    );
                }

                totalRewards += reward;


                const date =
                    new Date(
                        referral.created_at
                    ).toLocaleString();


                html += `
                    <div class="history-item">

                        <div class="title">
                            👥 ${role}
                        </div>

                        <div>
                            <strong>Referral Code:</strong>
                            ${escapeHtml(
                                referral.referral_code || "-"
                            )}
                        </div>

                        <div>
                            <strong>Reward:</strong>
                            +${reward} points
                        </div>

                        <div>
                            <strong>Date:</strong>
                            ${escapeHtml(date)}
                        </div>

                        <div>
                            <strong>Status:</strong>
                            <span class="status">
                                ${escapeHtml(
                                    referral.status || "completed"
                                )}
                            </span>
                        </div>

                    </div>
                `;
            });


            document.getElementById("referralCount")
                .textContent = totalReferrals;

            document.getElementById("rewardCount")
                .textContent = totalRewards;

            historyBox.innerHTML = html;

        } catch (error) {

            console.error(
                "Referral history error:",
                error
            );

            historyBox.innerHTML = `
                <div class="error">
                    Unable to load referral history.
                    <br><br>
                    Please refresh the page and try again.
                </div>
            `;
        }
    }


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    loadReferralHistory();
</script>

</body>
</html>
