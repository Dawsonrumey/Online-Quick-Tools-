<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Rewards - Online Quick Tools</title>

<meta name="description"
      content="Admin reward redemption management for Online Quick Tools.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fb;
    color:#222;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px 20px;
    border-radius:0 0 18px 18px;
    margin-bottom:20px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    opacity:.9;
}

.top-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:10px;
    padding:11px 16px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.home-btn{
    background:#111827;
    color:white;
}

.refresh-btn{
    background:#4f46e5;
    color:white;
}

.logout-btn{
    background:#dc2626;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:22px;
}

.stat{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat-title{
    color:#666;
    font-size:14px;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
    margin-top:6px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.card-header h2{
    margin:0;
    font-size:19px;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-pending{
    background:#fff7ed;
    color:#c2410c;
}

.status-approved{
    background:#ecfdf5;
    color:#047857;
}

.status-paid{
    background:#eff6ff;
    color:#1d4ed8;
}

.status-rejected{
    background:#fef2f2;
    color:#b91c1c;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.info{
    background:#f8fafc;
    padding:11px;
    border-radius:9px;
}

.info strong{
    display:block;
    font-size:12px;
    color:#64748b;
    margin-bottom:4px;
}

.info span{
    word-break:break-word;
}

.payment-box{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-radius:12px;
}

.payment-box h3{
    margin:0 0 10px;
    font-size:16px;
}

input,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:14px;
    outline:none;
}

textarea{
    min-height:70px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#4f46e5;
}

.action-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.approve-btn{
    background:#16a34a;
    color:white;
}

.reject-btn{
    background:#dc2626;
    color:white;
}

.paid-btn{
    background:#2563eb;
    color:white;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    display:none;
}

.message.success{
    display:block;
    background:#ecfdf5;
    color:#047857;
}

.message.error{
    display:block;
    background:#fef2f2;
    color:#b91c1c;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#777;
}

.small{
    font-size:12px;
    color:#64748b;
}

.warning{
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    background:#fff7ed;
    color:#9a3412;
    font-size:13px;
}

.success-box{
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    background:#eff6ff;
    color:#1e40af;
    font-size:13px;
}

@media(max-width:700px){

    .container{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:21px;
    }

    button{
        width:100%;
    }

    .action-buttons button{
        width:100%;
    }
}

</style>

</head>

<body>

<header>

    <div class="container">

        <h1>💰 Admin Rewards</h1>

        <p>Manage reward redemption and payment tracking</p>

    </div>

</header>


<div class="container">

    <div class="top-buttons">

        <button
            class="home-btn"
            onclick="location.href='index.html'">
            🏠 Home
        </button>

        <button
            class="refresh-btn"
            onclick="loadRedemptions()">
            🔄 Refresh
        </button>

        <button
            class="logout-btn"
            onclick="logoutAdmin()">
            🚪 Logout
        </button>

    </div>


    <div id="message" class="message"></div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                Total Requests
            </div>

            <div
                id="totalCount"
                class="stat-number">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Pending
            </div>

            <div
                id="pendingCount"
                class="stat-number">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Paid
            </div>

            <div
                id="paidCount"
                class="stat-number">
                0
            </div>

        </div>

    </div>


    <div id="loading"
         class="card"
         style="text-align:center;">

        Loading redemption requests...

    </div>


    <div id="requests"></div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const ADMIN_ID =
    "0f61afb6-b139-45d8-ac9e-83f1fd7265a9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

    const {
        data:{
            session
        }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

        location.href = "index.html";

        return false;
    }


    if(session.user.id !== ADMIN_ID){

        alert("Admin access required.");

        await supabaseClient.auth.signOut();

        location.href = "index.html";

        return false;
    }


    return true;
}


/* =========================
   LOAD REDEMPTIONS
========================= */

async function loadRedemptions(){

    const allowed =
        await checkAdmin();

    if(!allowed) return;


    document.getElementById("loading")
        .style.display = "block";


    const container =
        document.getElementById("requests");

    container.innerHTML = "";


    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "get_admin_reward_redemptions"
    );


    document.getElementById("loading")
        .style.display = "none";


    if(error){

        console.error(error);

        showMessage(
            "Failed to load redemption requests: "
            + error.message,
            "error"
        );

        return;
    }


    const requests =
        data || [];


    updateStats(requests);


    if(requests.length === 0){

        container.innerHTML = `
            <div class="card empty">
                No redemption requests found.
            </div>
        `;

        return;
    }


    requests.forEach(request => {

        container.appendChild(
            createRequestCard(request)
        );

    });

}


/* =========================
   STATS
========================= */

function updateStats(data){

    const total =
        data.length;

    const pending =
        data.filter(
            x => x.status === "pending"
        ).length;

    const paid =
        data.filter(
            x => x.status === "paid"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent = total;


    document.getElementById(
        "pendingCount"
    ).textContent = pending;


    document.getElementById(
        "paidCount"
    ).textContent = paid;

}


/* =========================
   STATUS
========================= */

function getStatusClass(status){

    if(status === "pending")
        return "status-pending";

    if(status === "approved")
        return "status-approved";

    if(status === "paid")
        return "status-paid";

    if(status === "rejected")
        return "status-rejected";

    return "";
}


/* =========================
   DATE FORMAT
========================= */

function formatDate(date){

    if(!date)
        return "-";


    return new Date(date)
        .toLocaleString();
}


/* =========================
   REQUEST CARD
========================= */

function createRequestCard(request){

    const card =
        document.createElement("div");

    card.className = "card";


    const status =
        String(request.status || "")
        .toLowerCase();


    let actionHTML = "";


    /* =========================
       PENDING
    ========================= */

    if(status === "pending"){

        actionHTML = `

            <div class="payment-box">

                <h3>⚙️ Admin Action</h3>

                <label class="small">
                    Admin note
                </label>

                <textarea
                    id="note-${request.id}"
                    placeholder="Optional note...">
                </textarea>

                <div class="action-buttons">

                    <button
                        class="approve-btn"
                        onclick="processRequest(
                            ${request.id},
                            'approved'
                        )">
                        ✅ Approve
                    </button>

                    <button
                        class="reject-btn"
                        onclick="processRequest(
                            ${request.id},
                            'rejected'
                        )">
                        ❌ Reject
                    </button>

                </div>

            </div>

        `;

    }


    /* =========================
       APPROVED
    ========================= */

    else if(status === "approved"){

        actionHTML = `

            <div class="payment-box">

                <h3>💸 Send Payment</h3>

                <div class="warning">

                    ⚠️ First send the payout amount
                    to the user's bKash/Nagad account.

                    Then enter the payment
                    transaction/reference ID below.

                </div>

                <br>

                <label class="small">
                    Payment Reference / Transaction ID
                </label>

                <input
                    id="payment-${request.id}"
                    type="text"
                    placeholder="Example: TXN123456789">

                <div class="action-buttons">

                    <button
                        class="paid-btn"
                        onclick="markAsPaid(${request.id})">
                        💳 Mark as Paid
                    </button>

                </div>

            </div>

        `;

    }


    /* =========================
       PAID
    ========================= */

    else if(status === "paid"){

        actionHTML = `

            <div class="success-box">

                ✅ Payment completed.

                <br><br>

                <strong>
                    Payment Reference:
                </strong>

                ${escapeHTML(
                    request.payment_reference ||
                    "-"
                )}

                <br>

                <strong>
                    Paid Date:
                </strong>

                ${formatDate(
                    request.paid_at
                )}

            </div>

        `;

    }


    /* =========================
       REJECTED
    ========================= */

    else if(status === "rejected"){

        actionHTML = `

            <div class="warning">

                ❌ This redemption request
                was rejected.

                ${
                    request.admin_note
                    ?
                    "<br><br><strong>Admin Note:</strong> "
                    + escapeHTML(
                        request.admin_note
                    )
                    :
                    ""
                }

            </div>

        `;

    }


    card.innerHTML = `

        <div class="card-header">

            <h2>
                👤 ${escapeHTML(
                    request.username || "User"
                )}
            </h2>

            <span
                class="status ${getStatusClass(status)}">

                ${status.toUpperCase()}

            </span>

        </div>


        <div class="info-grid">

            <div class="info">

                <strong>Request ID</strong>

                <span>
                    #${request.id}
                </span>

            </div>


            <div class="info">

                <strong>User ID</strong>

                <span>
                    ${escapeHTML(
                        request.user_id || "-"
                    )}
                </span>

            </div>


            <div class="info">

                <strong>Points</strong>

                <span>
                    ${Number(
                        request.points || 0
                    ).toLocaleString()}
                </span>

            </div>


            <div class="info">

                <strong>Processing Fee</strong>

                <span>
                    ৳${Number(
                        request.fee_amount || 0
                    ).toLocaleString()}
                </span>

            </div>


            <div class="info">

                <strong>Payout Amount</strong>

                <span>
                    ৳${Number(
                        request.payout_amount || 0
                    ).toLocaleString()}
                </span>

            </div>


            <div class="info">

                <strong>Payment Method</strong>

                <span>
                    ${escapeHTML(
                        request.reward_method || "-"
                    ).toUpperCase()}
                </span>

            </div>


            <div class="info">

                <strong>Payment Number</strong>

                <span>
                    ${escapeHTML(
                        request.reward_details || "-"
                    )}
                </span>

            </div>


            <div class="info">

                <strong>Request Date</strong>

                <span>
                    ${formatDate(
                        request.created_at
                    )}
                </span>

            </div>


            <div class="info">

                <strong>Processed Date</strong>

                <span>
                    ${formatDate(
                        request.processed_at
                    )}
                </span>

            </div>


            ${
                request.admin_note
                ?
                `
                <div class="info">

                    <strong>Admin Note</strong>

                    <span>
                        ${escapeHTML(
                            request.admin_note
                        )}
                    </span>

                </div>
                `
                :
                ""
            }


            ${
                request.payment_reference
                ?
                `
                <div class="info">

                    <strong>Payment Reference</strong>

                    <span>
                        ${escapeHTML(
                            request.payment_reference
                        )}
                    </span>

                </div>
                `
                :
                ""
            }


            ${
                request.paid_at
                ?
                `
                <div class="info">

                    <strong>Paid Date</strong>

                    <span>
                        ${formatDate(
                            request.paid_at
                        )}
                    </span>

                </div>
                `
                :
                ""
            }

        </div>


        ${actionHTML}

    `;


    return card;

}


/* =========================
   APPROVE / REJECT
========================= */

async function processRequest(
    id,
    decision
){

    const noteElement =
        document.getElementById(
            "note-" + id
        );


    const note =
        noteElement
        ?
        noteElement.value.trim()
        :
        "";


    const actionText =
        decision === "approved"
        ? "approve"
        : "reject";


    const confirmed =
        confirm(
            "Are you sure you want to "
            + actionText
            + " this redemption request?"
        );


    if(!confirmed)
        return;


    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "process_reward_redemption",
        {
            redemption_id: id,
            decision: decision,
            note: note || null
        }
    );


    if(error){

        console.error(error);

        showMessage(
            "Error: " + error.message,
            "error"
        );

        return;
    }


    if(!data || !data.success){

        showMessage(
            data?.message ||
            "Request could not be processed.",
            "error"
        );

        return;
    }


    showMessage(
        data.message ||
        "Request processed successfully.",
        "success"
    );


    await loadRedemptions();

}


/* =========================
   MARK AS PAID
========================= */

async function markAsPaid(id){

    const input =
        document.getElementById(
            "payment-" + id
        );


    if(!input)
        return;


    const reference =
        input.value.trim();


    if(reference.length < 3){

        showMessage(
            "Please enter the payment Transaction ID / Reference.",
            "error"
        );

        input.focus();

        return;
    }


    const confirmed =
        confirm(
            "Confirm that you have already sent the payout to the user?"
        );


    if(!confirmed)
        return;


    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "mark_reward_redemption_paid",
        {
            redemption_id: id,
            payment_reference_input: reference
        }
    );


    if(error){

        console.error(error);

        showMessage(
            "Payment update failed: "
            + error.message,
            "error"
        );

        return;
    }


    if(!data || !data.success){

        showMessage(
            data?.message ||
            "Payment could not be marked as paid.",
            "error"
        );

        return;
    }


    showMessage(
        "✅ Payment marked as PAID successfully.",
        "success"
    );


    await loadRedemptions();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

    await supabaseClient.auth.signOut();

    location.href = "index.html";

}


/* =========================
   START
========================= */

(async function(){

    const allowed =
        await checkAdmin();

    if(allowed){

        await loadRedemptions();

    }

})();

</script>

</body>
</html>
