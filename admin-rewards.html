<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Rewards - Online Quick Tools</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6fb;
    color:#222;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.header{
    background:#4f46e5;
    color:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 6px;
    font-size:25px;
}

.header p{
    margin:0;
    opacity:.9;
}

.topbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:10px;
    padding:11px 16px;
    font-size:14px;
    cursor:pointer;
}

.home-btn{
    background:#e5e7eb;
    color:#111827;
}

.refresh-btn{
    background:#4f46e5;
    color:white;
}

.logout-btn{
    background:#dc2626;
    color:white;
}

.message{
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat-title{
    font-size:13px;
    color:#6b7280;
    margin-bottom:7px;
}

.stat-value{
    font-size:25px;
    font-weight:bold;
}

.request{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.request-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
}

.user{
    font-size:18px;
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
}

.status.pending{
    background:#fef3c7;
    color:#92400e;
}

.status.approved{
    background:#dcfce7;
    color:#166534;
}

.status.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
}

.detail{
    background:#f8fafc;
    border-radius:10px;
    padding:11px;
}

.detail-label{
    display:block;
    color:#6b7280;
    font-size:12px;
    margin-bottom:4px;
}

.detail-value{
    font-weight:bold;
    word-break:break-word;
}

.payout{
    color:#15803d;
    font-size:18px;
}

.fee{
    color:#dc2626;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.approve{
    background:#16a34a;
    color:white;
}

.reject{
    background:#dc2626;
    color:white;
}

.note-input{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:14px;
    margin-top:10px;
}

.empty{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:15px;
    color:#6b7280;
}

.loading{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

@media(max-width:700px){

    .container{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:22px;
    }

    button{
        width:100%;
    }

    .topbar button{
        width:100%;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>💰 Admin Rewards</h1>

        <p>
            Manage user reward redemption requests
        </p>

    </div>


    <div class="topbar">

        <button
            class="home-btn"
            onclick="location.href='index.html'">
            🏠 Home
        </button>

        <button
            class="refresh-btn"
            onclick="loadRequests()">
            🔄 Refresh
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            🚪 Logout
        </button>

    </div>


    <div id="message"
         class="message">
    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                Total Requests
            </div>

            <div
                id="totalRequests"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Pending
            </div>

            <div
                id="pendingRequests"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Approved
            </div>

            <div
                id="approvedRequests"
                class="stat-value">
                0
            </div>

        </div>

    </div>


    <div id="requests">

        <div class="loading">
            Loading redemption requests...
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";

const ADMIN_ID =
"0f61afb6-b139-45d8-ac9e-83f1fd7265a9";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display = "block";

}


function hideMessage(){

    const box =
        document.getElementById("message");

    box.style.display = "none";

}


async function checkAdmin(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();


    if(error || !data.user){

        location.href = "index.html";

        return false;

    }


    if(data.user.id !== ADMIN_ID){

        showMessage(
            "❌ Admin access required.",
            "error"
        );

        document.getElementById("requests")
            .innerHTML =
            '<div class="empty">You are not authorized to view this page.</div>';

        return false;

    }


    return true;

}


async function loadRequests(){

    hideMessage();


    const allowed =
        await checkAdmin();

    if(!allowed) return;


    const box =
        document.getElementById("requests");


    box.innerHTML =
        '<div class="loading">Loading redemption requests...</div>';


    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "get_admin_reward_redemptions"
    );


    if(error){

        console.error(error);

        showMessage(
            "❌ Failed to load redemption requests: " +
            error.message,
            "error"
        );

        box.innerHTML =
            '<div class="empty">Unable to load requests.</div>';

        return;

    }


    updateStats(data || []);


    if(!data || data.length === 0){

        box.innerHTML =
            '<div class="empty">' +
            '🎉 No redemption requests found.' +
            '</div>';

        return;

    }


    box.innerHTML =
        data.map(renderRequest).join("");

}


function updateStats(data){

    const total =
        data.length;


    const pending =
        data.filter(
            r => r.status === "pending"
        ).length;


    const approved =
        data.filter(
            r => r.status === "approved"
        ).length;


    document.getElementById(
        "totalRequests"
    ).textContent = total;


    document.getElementById(
        "pendingRequests"
    ).textContent = pending;


    document.getElementById(
        "approvedRequests"
    ).textContent = approved;

}


function renderRequest(r){

    const date =
        r.created_at
        ? new Date(r.created_at)
            .toLocaleString()
        : "-";


    const processed =
        r.processed_at
        ? new Date(r.processed_at)
            .toLocaleString()
        : "-";


    const method =
        r.reward_method
        ? r.reward_method.toUpperCase()
        : "-";


    const statusClass =
        r.status || "pending";


    let actions = "";


    if(r.status === "pending"){

        actions = `

            <input
                id="note-${r.id}"
                class="note-input"
                placeholder="Optional admin note">

            <div class="actions">

                <button
                    class="approve"
                    onclick="processRequest(
                        ${r.id},
                        'approved'
                    )">
                    ✅ Approve
                </button>

                <button
                    class="reject"
                    onclick="processRequest(
                        ${r.id},
                        'rejected'
                    )">
                    ❌ Reject
                </button>

            </div>

        `;

    }


    return `

        <div class="request">

            <div class="request-head">

                <div class="user">
                    👤 ${escapeHtml(
                        r.username || "User"
                    )}
                </div>

                <span
                    class="status ${statusClass}">
                    ${escapeHtml(
                        r.status
                    )}
                </span>

            </div>


            <div class="details">

                <div class="detail">

                    <span class="detail-label">
                        Points
                    </span>

                    <span class="detail-value">
                        ${r.points}
                    </span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Processing Fee
                    </span>

                    <span class="detail-value fee">
                        ৳${r.fee_amount}
                    </span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        User Payout
                    </span>

                    <span class="detail-value payout">
                        ৳${r.payout_amount}
                    </span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Payment Method
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(method)}
                    </span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Payment Number
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(
                            r.reward_details || "-"
                        )}
                    </span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Request Date
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(date)}
                    </span>

                </div>

            </div>


            ${
                r.admin_note
                ?
                `<div class="detail">
                    <span class="detail-label">
                        Admin Note
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(
                            r.admin_note
                        )}
                    </span>
                </div>`
                :
                ""
            }


            ${
                r.status !== "pending"
                ?
                `<div class="detail"
                      style="margin-top:10px;">

                    <span class="detail-label">
                        Processed
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(processed)}
                    </span>

                </div>`
                :
                ""
            }


            ${actions}

        </div>

    `;

}


async function processRequest(
    redemptionId,
    decision
){

    let note = "";


    const input =
        document.getElementById(
            "note-" + redemptionId
        );


    if(input){

        note =
            input.value.trim();

    }


    const actionText =
        decision === "approved"
        ? "approve"
        : "reject";


    const confirmed =
        confirm(
            "Are you sure you want to " +
            actionText +
            " this redemption request?"
        );


    if(!confirmed){

        return;

    }


    hideMessage();


    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "process_reward_redemption",
        {
            redemption_id:
                redemptionId,

            decision:
                decision,

            note:
                note || null
        }
    );


    if(error){

        console.error(error);

        showMessage(
            "❌ " + error.message,
            "error"
        );

        return;

    }


    if(!data || !data.success){

        showMessage(
            "❌ " +
            (
                data?.message ||
                "Request failed."
            ),
            "error"
        );

        return;

    }


    showMessage(
        decision === "approved"
        ? "✅ Redemption approved successfully."
        : "✅ Redemption rejected successfully.",
        "success"
    );


    await loadRequests();

}


async function logout(){

    await supabaseClient.auth.signOut();

    location.href = "index.html";

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


loadRequests();

</script>

</body>
</html>
