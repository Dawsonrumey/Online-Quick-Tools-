<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard - Online Quick Tools</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#111827;
}

header{
    background:#2563eb;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0 0 12px;
    font-size:24px;
}

.logout{
    background:white;
    color:#2563eb;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:600px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
}

.points{
    font-size:38px;
    font-weight:bold;
    color:#2563eb;
    margin:10px 0;
}

.label{
    color:#6b7280;
    font-size:14px;
}

.action{
    width:100%;
    border:0;
    background:#2563eb;
    color:white;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.action:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#rewardMessage{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>

<h1>Online Quick Tools</h1>

<button
    class="logout"
    id="logoutButton"
    type="button"
>
    Logout
</button>

</header>


<div class="container">

<div id="loading" class="card">
    Loading your dashboard...
</div>


<div id="dashboard"
     style="display:none;">

    <div class="card">

        <div class="label">
            Welcome
        </div>

        <h2 id="username">
            User
        </h2>

        <div class="label">
            Available Points
        </div>

        <div class="points"
             id="points">
            0
        </div>

        <div class="label">
            Account Email
        </div>

        <div id="email">
            -
        </div>

    </div>


    <div class="card">

        <h2>🎁 Daily Reward</h2>

        <button
            class="action"
            id="dailyRewardButton"
            type="button"
        >
            Claim Daily Reward

            <span id="dailyRewardText">
                Get 10 points once per day
            </span>

        </button>


        <div
            id="rewardMessage"
        ></div>

    </div>


    <div class="card">

        <h2>Quick Links</h2>

        <button
            class="action"
            type="button"
            onclick="location.href='index.html'"
        >
            🏠 Home
        </button>

    </div>

</div>


<div id="errorBox"
     style="display:none;"
     class="error">
</div>

</div>


<script>

const SUPABASE_URL =
    "https://etkqkptoxkfhxcysaadi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QLp5kSKz9XU5Uba4X_u_jA_DRfXO22T";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loading =
    document.getElementById("loading");

const dashboard =
    document.getElementById("dashboard");

const errorBox =
    document.getElementById("errorBox");

const usernameElement =
    document.getElementById("username");

const pointsElement =
    document.getElementById("points");

const emailElement =
    document.getElementById("email");

const logoutButton =
    document.getElementById("logoutButton");

const dailyRewardButton =
    document.getElementById("dailyRewardButton");

const dailyRewardText =
    document.getElementById("dailyRewardText");


function showError(message){

    loading.style.display = "none";

    dashboard.style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent = message;

}


async function loadDashboard(){

    try{

        const {
            data: {
                user
            },
            error: userError
        } =
        await supabaseClient.auth.getUser();


        if(userError){

            throw userError;

        }


        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        emailElement.textContent =
            user.email || "-";


        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select("username, points")
            .eq("id", user.id)
            .single();


        if(profileError){

            throw profileError;

        }


        usernameElement.textContent =
            profile.username ||
            user.email.split("@")[0];


        pointsElement.textContent =
            profile.points ?? 0;


        loading.style.display =
            "none";

        dashboard.style.display =
            "block";


    }catch(error){

        console.error(
            "Dashboard error:",
            error
        );

        showError(
            error.message ||
            "Unable to load dashboard."
        );

    }

}


async function claimDailyReward(){

    dailyRewardButton.disabled =
        true;

    dailyRewardText.textContent =
        "Claiming...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "claim_daily_login_reward"
        );


        if(error){

            throw error;

        }


        if(data === 10){

            showRewardMessage(
                "🎉 You received 10 points today!"
            );

        }else{

            showRewardMessage(
                "You already claimed today's reward."
            );

        }


        await loadDashboard();


        dailyRewardButton.disabled =
            true;

        dailyRewardText.textContent =
            "Already claimed today";


    }catch(error){

        console.error(
            "Reward error:",
            error
        );

        showRewardMessage(
            error.message ||
            "Unable to claim reward."
        );


        dailyRewardButton.disabled =
            false;

        dailyRewardText.textContent =
            "Get 10 points once per day";

    }

}


function showRewardMessage(text){

    const message =
        document.getElementById(
            "rewardMessage"
        );

    message.textContent =
        text;

    message.style.display =
        "block";

}


logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        window.location.href =
            "login.html";

    }
);


dailyRewardButton.addEventListener(
    "click",
    claimDailyReward
);


loadDashboard();

</script>

</body>
</html>
